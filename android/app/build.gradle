plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def env = { String name, String fallback -> System.getenv(name) ?: fallback }

android {
    namespace 'ch.fitapp.privat'
    compileSdk 36

    defaultConfig {
        applicationId 'ch.fitapp.privat'
        minSdk 26
        targetSdk 34
        versionCode env('VERSION_CODE', '1').toInteger()
        versionName '1.' + env('VERSION_CODE', '1')
        resValue 'string', 'app_url', env('APP_URL', 'https://example.github.io/fitapp/')
    }

    buildFeatures {
        resValues true
    }

    signingConfigs {
        release {
            storeFile file(env('KEYSTORE_PATH', 'fehlt.p12'))
            storePassword env('KEYSTORE_PASSWORD', '')
            keyAlias 'fitapp'
            keyPassword env('KEYSTORE_PASSWORD', '')
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    /* Health Connect: liest Schritte, Schlaf, Puls und Trainings, die Samsung Health dort ablegt */
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
