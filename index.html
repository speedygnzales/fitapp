<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FitApp</title>
<style>
:root {
  --bg: #0E0E0E; --fill: #161616; --fill2: #1E1E1E; --line: #262626; --line2: #333333; --hair: #1C1C1C;
  --ink: #FAFAFA; --muted: #A3A3A3; --faint: #8A8A8A; --inv: #0E0E0E;
  --r: 14px; --rs: 10px; --tab-h: 64px; --pill-h: 112px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --gut: #0ca30c; --knapp: #fab219; --mies: #d03b3b;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.45 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh;
  padding-bottom: calc(var(--tab-h) + var(--safe-b) + 20px); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.lab { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 12px; background: rgba(14,14,14,.94);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
header.top h1 { flex: 1; margin: 0; font-size: 1.4rem; font-weight: 600; letter-spacing: -.01em; }
.iconbtn { width: 44px; height: 44px; border-radius: var(--rs); border: 1px solid var(--line2); background: transparent;
  display: inline-flex; align-items: center; justify-content: center; padding: 0; position: relative; flex: 0 0 auto; }
.badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 6px; background: var(--ink); color: var(--inv);
  font-size: .72rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; box-shadow: 0 0 0 2px var(--bg); }
.badge:empty { display: none; }
.iconbtn.an { background: var(--ink); border-color: var(--ink); color: var(--inv); }

main { padding: 14px 20px 16px; max-width: 720px; margin: 0 auto; }
.card { background: transparent; border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
.card h3 { margin: 0 0 4px; font-size: 1.06rem; font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.btn { min-height: 48px; border-radius: var(--rs); border: 1px solid var(--line2); background: transparent; padding: 0 16px; font-weight: 500; }
.btn.primary, .btn.ok { background: var(--ink); border-color: var(--ink); color: var(--inv); font-weight: 600; }
.btn.danger { border-color: #6B2B2B; color: #FF8A8A; }
.btn.wide { width: 100%; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: .9rem; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 20px 14px; margin: 0 -20px; scrollbar-width: none; }
.card .chips { margin: 0; padding: 0; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; min-height: 40px; border-radius: var(--rs); border: 1px solid var(--line2); background: transparent; color: var(--muted);
  padding: 0 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--inv); font-weight: 600; }
.chip .x { opacity: .7; padding-left: 2px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--r); padding: 4px; gap: 4px; margin-bottom: 12px; }
.seg button { flex: 1; min-height: 44px; border: 0; border-radius: var(--rs); background: transparent; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--inv); font-weight: 600; }
input[type=text], input[type=search], input[type=password], input:not([type]), select, input[inputmode] {
  min-height: 48px; border-radius: var(--rs); border: 1px solid var(--line2); background: var(--fill); padding: 0 14px; width: 100%; outline: none; }
input:focus, select:focus { border-color: var(--ink); }
label.field { display: block; margin-bottom: 10px; }
label.field span { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.switch { width: 50px; height: 30px; border-radius: 8px; background: var(--fill2); border: 1px solid var(--line2); position: relative; flex: 0 0 auto; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 5px; background: var(--muted); transition: left .15s, background .15s; }
.switch[aria-checked="true"] { background: var(--ink); border-color: var(--ink); }
.switch[aria-checked="true"]::after { left: 23px; background: var(--inv); }
.note { border: 1px solid var(--line2); border-radius: var(--r); padding: 14px 16px; margin-bottom: 12px; font-size: .92rem; color: var(--muted); }
.note b { color: var(--ink); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }

/* Training */
.abschluss { margin: -2px 0 12px; }
.steig { display: flex; gap: 9px; align-items: flex-start; margin: 12px 0 2px; padding: 10px 12px; border-radius: 11px; background: var(--fill); font-size: .84rem; line-height: 1.4; color: var(--ink); }
.steig svg { flex: 0 0 auto; margin-top: 2px; color: var(--muted); }
.steig.s-kg, .steig.s-stufe { background: var(--ink); color: var(--inv); font-weight: 500; }
.steig.s-kg svg, .steig.s-stufe svg { color: var(--inv); }
.daycard { display: flex; align-items: center; gap: 16px; }
.ring { width: 58px; height: 58px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; transition: --p .6s cubic-bezier(.2,.8,.2,1);
  background: conic-gradient(var(--ink) calc(var(--p) * 1%), var(--line) 0); }
.ring span { width: 48px; height: 48px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center;
  font-size: .78rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.daycard h2 { margin: 3px 0 0; font-size: 1.12rem; font-weight: 600; line-height: 1.25; }
.daycard .sub { font-size: .85rem; color: var(--muted); margin-top: 2px; }
.daycard .sub button { border: 0; background: none; padding: 6px 0; color: var(--ink); font-size: inherit; text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; }
.ex { border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 4px; margin-bottom: 12px; }
.ex.card { padding-bottom: 16px; }
.exn { margin: 0; font-size: 1.06rem; font-weight: 600; line-height: 1.3; }
.ex .ziel { font-size: .84rem; color: var(--muted); margin-top: 2px; }
.ex.aktiv { border-color: var(--muted); }
.ex.fertig .exhead, .ex.fertig .extools { opacity: .55; }
.ex .jetzt { display: inline-block; font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--inv); background: var(--ink); border-radius: 6px; padding: 3px 7px; margin: -4px 0 10px; }
.exhead { display: flex; gap: 12px; align-items: center; }
.exinfo { min-width: 0; flex: 1; }
.exhead .exn { margin: 0; }
.ex .last { font-size: .8rem; color: var(--faint); margin-top: 3px; font-variant-numeric: tabular-nums; }
.pv { flex: 0 0 auto; width: 64px; height: 64px; padding: 0; border: 1px solid var(--line2); border-radius: 12px; overflow: hidden; background: var(--fill); display: flex; align-items: center; justify-content: center; color: var(--muted); }
.pv-leer { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
.pv-anim { position: relative; display: block; width: 100%; height: 100%; background: #141414; }
.pv-anim img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
.pv-anim img + img { animation: pvwechsel 2.4s steps(1, end) infinite; }
.pv-anim.kaputt { display: none; }
.pv-fig { display: block; width: 100%; height: 100%; background: #141414; }
.pv-fig svg { display: block; width: 100%; height: 100%; }
.pv-fig .fb { animation: pvwechsel 2.4s steps(1, end) infinite; }
.pv-fig .fa { animation: pvaus 2.4s steps(1, end) infinite; }
@keyframes pvaus { 0% { opacity: 1; } 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pv-fig .fb { display: none; } }
@keyframes pvwechsel { 0% { opacity: 0; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pv-anim img + img { animation: none; opacity: 0; } }
.extools { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 6px; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 10px; background: transparent; color: var(--ink); font-size: .84rem; }
.tbtn:active, .vidbtn:active { background: var(--fill2); }
.ueb-bild { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 4 / 3; background: var(--fill); display: flex; align-items: center; justify-content: center; color: var(--muted); }
.ueb-bild .pv-anim img { object-fit: cover; }
.ueb-fakten { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 14px; }
.ueb-fakten > div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.ueb-fakten b { display: block; margin-top: 4px; font-weight: 600; font-size: .92rem; }
.chip.on { color: var(--ink); background: var(--fill2); border-color: var(--fill2); min-height: 32px; font-size: .82rem; cursor: default; }
.scan-cam { position: relative; border-radius: 18px; overflow: hidden; background: #000; height: min(56vh, 480px); }
.scan-cam[hidden] { display: none; }
.scan-cam video { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .25s; background: #000; }
.scan-cam.laeuft video { opacity: 1; }
.scan-load { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.scan-cam.laeuft .scan-load { display: none; }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.18); border-top-color: #fff; animation: drehen .8s linear infinite; display: inline-block; }
@keyframes drehen { to { transform: rotate(360deg); } }
.scan-linie { position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: #fff; opacity: 0; box-shadow: 0 0 12px rgba(255,255,255,.8); }
.scan-cam.laeuft .scan-linie { opacity: .85; animation: linie 1.8s ease-in-out infinite alternate; }
@keyframes linie { from { top: 12%; } to { top: 86%; } }
.scan-cam.ok .scan-rahmen { border-color: #fff; border-width: 3px; }
.scan-cam.ok .scan-linie { animation: none; opacity: 0; }
.scan-licht { position: absolute; right: 12px; bottom: 12px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.45); color: #fff; display: flex; align-items: center; justify-content: center; }
.scan-licht[aria-pressed="true"] { background: #fff; color: #000; }
.scan-licht[hidden] { display: none; }
.prod-laden { display: flex; align-items: center; gap: 12px; color: var(--muted); padding: 18px 0; }
@media (prefers-reduced-motion: reduce) { .scan-cam.laeuft .scan-linie, .spin { animation: none; } }
.scan-rahmen { position: absolute; left: 10%; right: 10%; top: 28%; bottom: 28%; border: 2px solid rgba(255,255,255,.9); border-radius: 14px; box-shadow: 0 0 0 999px rgba(0,0,0,.4); overflow: hidden; transition: border-width .15s; }
.scan-hand { display: flex; gap: 8px; margin-top: 10px; }
.scan-hand input { flex: 1; min-width: 0; min-height: 48px; border-radius: var(--rs); border: 1px solid var(--line2); background: var(--fill); color: var(--ink); padding: 0 12px; font: inherit; }
.scan-alt-liste { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.scan-alt { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); text-align: left; }
.scan-alt img, .scan-alt .ph { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--fill2); flex: 0 0 auto; }
.scan-alt > span { display: flex; flex-direction: column; min-width: 0; }
.prod-kopf { display: flex; gap: 14px; align-items: center; }
.prod-kopf img { width: 76px; height: 76px; object-fit: contain; border-radius: 12px; background: #fff; flex: 0 0 auto; }
.prod-kopf h3 { margin: 0 0 4px; }
.faint { color: var(--faint); }
.urteil ul { margin: 6px 0 0; padding-left: 18px; }
.urteil.gut { border-color: var(--ink); }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-top: 12px; }
.score { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.score .scn { font-size: 1.6rem; font-weight: 600; line-height: 1.1; }
.naehr { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: .92rem; }
.naehr td { padding: 8px 0; border-top: 1px solid var(--hair); }
.naehr td + td { text-align: right; font-variant-numeric: tabular-nums; }
.konzern-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.konzern-links .tbtn { text-decoration: none; }
ol.schritte { margin: 8px 0 0; padding-left: 22px; }
ol.schritte li { margin: 0 0 8px; line-height: 1.45; }
.vidbtn { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; color: var(--ink); text-decoration: none; }
.sethead, .set { display: grid; grid-template-columns: 44px minmax(0, 1fr) 48px; align-items: center; column-gap: 8px; }
.ex.kg .sethead, .ex.kg .set { grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr) 48px; }
.sethead { font-size: .74rem; color: var(--faint); padding: 12px 0 6px; border-bottom: 1px solid var(--line); }
.sethead span:last-child { text-align: right; }
.set { min-height: 58px; border-bottom: 1px solid var(--hair); }
.set:last-of-type { border-bottom: 0; }
.set .nr { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.fld { display: flex; align-items: baseline; gap: 4px; min-width: 0; }
.fld input { width: 3.4em; min-height: 44px; border: 1px solid transparent; border-radius: 8px; background: transparent; padding: 0 6px; margin-left: -7px;
  font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.fld input:focus { background: var(--fill); border-color: var(--line2); }
.fld span { color: var(--faint); font-size: .76rem; }
.set.done .fld input, .set.done .nr { color: var(--faint); }
.sc { width: 44px; height: 44px; justify-self: end; border-radius: var(--rs); border: 1.5px solid #444; background: transparent;
  display: flex; align-items: center; justify-content: center; padding: 0; color: transparent; transition: background .12s, border-color .12s; }
.sc[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--inv); }
details.how { margin: 4px 0 8px; }
details.how summary { color: var(--muted); min-height: 40px; display: flex; align-items: center; font-size: .86rem; cursor: pointer; list-style: none; }
details.how summary::before { content: "+"; width: 16px; color: var(--faint); }
details.how[open] summary::before { content: "−"; }
details.how summary::-webkit-details-marker { display: none; }
details.how p { margin: 0 0 8px; font-size: .9rem; }
.edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
label.field.check { display: flex; align-items: center; gap: 12px; grid-column: 1 / -1; min-height: 48px; margin: 0 0 10px; }
label.field.check input { width: 22px; height: 22px; min-height: 0; margin: 0; flex: 0 0 auto; accent-color: #FAFAFA; }
label.field.check span { display: inline; margin: 0; color: var(--ink); font-size: .95rem; }
.actions { margin-top: 18px; display: grid; gap: 10px; }

/* Streak */
.streak { padding: 14px 16px; }
.sk-top { display: flex; align-items: center; gap: 12px; }
.sk-flamme { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; color: var(--faint); flex: 0 0 auto; }
.sk-flamme.an { color: var(--ink); }
.streak.heute .sk-flamme { background: var(--ink); border-color: var(--ink); color: var(--inv); }
.sk-zahl { flex: 1 1 auto; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.sk-zahl b { font-size: 2rem; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
.sk-zahl span { font-size: .82rem; color: var(--muted); }
.sk-frz { display: flex; gap: 6px; }
.sk-frz i { width: 32px; height: 32px; border-radius: 8px; border: 1px dashed var(--line2); display: flex; align-items: center; justify-content: center; color: #555; }
.sk-frz i.an { border: 1px solid var(--ink); color: var(--ink); }
.sk-woche { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
.sk-tag { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: .68rem; color: var(--faint); }
.sk-tag i { width: 100%; max-width: 34px; aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink); }
.sk-tag i svg { width: 14px; height: 14px; }
.sk-tag.ok i { background: var(--ink); border-color: var(--ink); }
.sk-tag.freeze i { border: 1px solid var(--ink); }
.sk-tag.weg i { border-style: dashed; border-color: #5A5A5A; background: repeating-linear-gradient(135deg, transparent 0 5px, #2A2A2A 5px 6px); }
.sk-tag.offen i { border: 1.5px solid var(--muted); }
.sk-tag.offen span { color: var(--ink); font-weight: 600; }
.sk-unten { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: .78rem; color: var(--muted); }
.sk-unten span:first-child { color: var(--ink); }

/* Pausentimer, schwebt frei über der Navigation */
#timerbar { position: fixed; left: 12px; right: 12px; bottom: calc(var(--tab-h) + var(--safe-b) + 10px); z-index: 25; max-width: 696px; margin: 0 auto;
  border-radius: 22px; padding: 12px 12px 12px 18px; background: #1A1A1A; color: var(--ink); border: 1px solid var(--line2);
  box-shadow: 0 16px 40px rgba(0,0,0,.65); transition: background-color .35s ease, color .35s ease, border-color .35s ease; }
#timerbar[hidden] { display: none; }
.dock-kopf { display: flex; align-items: center; gap: 10px; min-height: 26px; }
.dock-phase { font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 4px 9px; border-radius: 7px; background: var(--fill2); color: var(--ink); flex: 0 0 auto; transition: background-color .35s ease, color .35s ease; }
.dock-ctx { flex: 1; min-width: 0; font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .35s ease; }
.dock-x { width: 30px; height: 30px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 auto; }
.dock-main { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
#timerbar .clock { flex: 1; font-size: 2.3rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
#timerbar .adj { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 13px; border: 0; background: var(--fill2); color: var(--ink); font-weight: 600; font-size: .85rem; display: flex; align-items: center; justify-content: center; padding: 0; transition: background-color .35s ease, color .35s ease, transform .12s ease; }
#timerbar .go { width: 52px; height: 52px; flex: 0 0 auto; border-radius: 16px; border: 0; background: var(--ink); color: var(--inv); display: flex; align-items: center; justify-content: center; padding: 0; transition: background-color .35s ease, color .35s ease, transform .12s ease; }
#timerbar .adj:active, #timerbar .go:active { transform: scale(.94); }
.dock-spur { height: 4px; border-radius: 4px; background: var(--line); margin-top: 12px; overflow: hidden; }
.dock-spur i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 4px; transition: width .2s linear, background-color .35s ease; }
/* Arbeit: hell, nicht zu übersehen. Pause: dunkel und ruhig. */
#timerbar.ph-arbeit { background: var(--ink); color: var(--inv); border-color: var(--ink); }
#timerbar.ph-arbeit .dock-phase { background: var(--inv); color: var(--ink); }
#timerbar.ph-arbeit .dock-ctx, #timerbar.ph-arbeit .dock-x { color: #555; }
#timerbar.ph-arbeit .adj { background: #E2E2E2; color: var(--inv); }
#timerbar.ph-arbeit .go { background: var(--inv); color: var(--ink); }
#timerbar.ph-arbeit .dock-spur { background: #D4D4D4; }

/* Suchen */
.tb-q { position: sticky; top: -12px; z-index: 2; background: #121212; margin: -12px 0 0; padding: 12px 0 10px; }
.tb-schnell { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 2px 0 14px; }
.tb-schnell button { min-height: 66px; border-radius: 14px; border: 1px solid var(--line2); background: transparent; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: .8rem; font-weight: 500; padding: 0 4px; }
.tb-schnell button:first-child { background: var(--ink); border-color: var(--ink); color: var(--inv); font-weight: 600; }
.tb-lab { margin: 4px 0 4px; }
.tb-li { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 0; border-bottom: 1px solid var(--hair); cursor: pointer; }
.tb-li .t .q { font-size: .64rem; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-top: 2px; }
.tb-plus { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line2); background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 auto; font-weight: 700; font-size: .84rem; font-variant-numeric: tabular-nums; }
.tb-plus.hat { background: var(--ink); border-color: var(--ink); color: var(--inv); }
.tb-plus.pop { animation: druck .3s ease; }
/* Menge */
.mg-zur { margin: 0 0 12px; padding-left: 6px; }
.mg-zur svg { width: 16px; height: 16px; }
.mg-kopf { display: flex; gap: 14px; align-items: center; }
.mg-kopf .tb-img { width: 58px; height: 58px; border-radius: 14px; }
.mg-kopf h3 { margin: 0; font-size: 1.06rem; font-weight: 600; line-height: 1.3; }
.mg-fav { border: 0; color: var(--muted); }
.mg-fav[aria-pressed="true"] { color: var(--ink); }
.mg-fav.pop svg { animation: hak .34s cubic-bezier(.3,1.5,.5,1) both; }
.mg-nw { display: grid; grid-template-columns: 1.25fr 1fr 1fr 1fr; gap: 8px; margin-top: 16px; }
.mg-nw > div { border: 1px solid var(--line); border-radius: 13px; padding: 11px 10px 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.mg-nw > div.haupt { background: var(--ink); color: var(--inv); border-color: var(--ink); }
.mg-nw b { font-size: 1.32rem; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; white-space: nowrap; }
.mg-nw b small { font-size: .72rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.mg-nw b.ka { font-size: 1rem; color: var(--faint); font-weight: 500; }
.mg-nw span { font-size: .68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mg-nw > div.haupt span { color: #555; }
.mg-rest { margin: 12px 2px 0; font-size: .84rem; color: var(--muted); line-height: 1.45; min-height: 2.9em; }
.mg-rest b { color: var(--ink); font-weight: 600; }
.mg-lab { margin: 16px 0 8px; }
.mg-einh { display: flex; flex-wrap: wrap; gap: 6px; }
.mg-step { display: flex; align-items: stretch; gap: 10px; }
.mg-step > button { width: 60px; min-height: 60px; border-radius: 16px; border: 1px solid var(--line2); background: transparent; color: var(--ink); font-size: 1.6rem; font-weight: 400; display: flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 auto; transition: transform .12s ease, background-color .18s ease; }
.mg-step > button:active { transform: scale(.94); background: var(--fill2); }
.mg-step .feld { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line2); border-radius: 16px; min-height: 60px; background: var(--fill); padding: 0 12px; cursor: text; }
.mg-step .feld:focus-within { border-color: var(--ink); }
.mg-step .feld input[inputmode] { width: 3ch; min-width: 2ch; min-height: 56px; border: 0; background: transparent; padding: 0; text-align: right; font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.mg-step .feld span { color: var(--muted); font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mg-schnell { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.mg-schnell .chip { min-width: 0; padding: 0 2px; justify-content: center; font-variant-numeric: tabular-nums; font-size: .86rem; }
.seg.vier button { font-size: .86rem; padding: 0 2px; }
.chips.laden { padding-bottom: 8px; }
.mg-mahl { margin-bottom: 0; }
.mg-ok { margin-top: 18px; min-height: 54px; border-radius: 14px; font-size: 1rem; }
.mg-det { display: block; margin: 12px auto 0; }
#toast.mit { display: flex; align-items: center; gap: 16px; padding: 8px 8px 8px 18px; }
#toast.mit.show { pointer-events: auto; }
#toast.mit span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#toast.mit button { flex: 0 0 auto; border: 0; border-radius: 9px; background: #E4E4E4; color: var(--inv); font-weight: 700; font-size: .84rem; padding: 8px 12px; }
.scan-ziel { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line2); border-radius: 14px; padding: 8px 8px 8px 14px; margin-bottom: 12px; font-size: .9rem; }
.scan-ziel span { flex: 1; min-width: 0; }
.scan-ziel b { font-weight: 600; }
.tb-plus-k, .tb-p1, .tb-plus, .tb-schnell button, .tb-tag, .linkbtn { transition: transform .12s ease, background-color .18s ease, border-color .18s ease, color .18s ease; }
.tb-plus-k:active, .tb-p1:active, .tb-plus:active, .tb-schnell button:active, .tb-mini:active { transform: scale(.95); }
@media (max-width: 360px) { .tb-sum { gap: 12px 14px; padding: 16px 14px; } .tb-ring .mitte b { font-size: 1.45rem; } .mg-nw b { font-size: 1.12rem; } }

/* Statistik: ruhige Linien, schmale Marken, Daten sind das Einzige, was laut sein darf */
.st-seg { margin-bottom: 10px; }
.st-zeit { padding-bottom: 12px; }
.st-k { padding: 18px 16px 14px; }
.st-kopf { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.st-kopf h3 { margin: 0; font-size: 1.04rem; }
.st-hero { font-size: 3.2rem; font-weight: 600; letter-spacing: -.035em; line-height: 1.05; margin-top: 6px; }
.st-hero small { font-size: 1.1rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.st-sub { margin: 6px 0 0; font-size: .88rem; color: var(--muted); line-height: 1.45; }
.st-sub b { color: var(--ink); font-weight: 600; }
.st-info { margin: 12px 0 0; min-height: 1.3em; font-size: .8rem; color: var(--faint); line-height: 1.4; }
.st-hw { margin: 10px 0 0; font-size: .76rem; color: var(--faint); line-height: 1.45; }
.st-gut { margin: 0; font-size: .92rem; }
.st-leer { padding: 24px 6px 18px; text-align: center; color: var(--muted); font-size: .92rem; line-height: 1.5; }
.st-unterlab { margin: 18px 0 8px; }
/* Farbstufen: eine geordnete Graustufen Skala, geprüft auf dunklem Grund, dazu Schraffur für fehlende Werte */
.c1 { background: var(--ink); } .c2 { background: #A3A3A3; } .c3 { background: #5E5E5E; }
.cx { background: repeating-linear-gradient(135deg, #5A5A5A 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px #4A4A4A; }
.st-stapel { display: flex; gap: 2px; height: 30px; margin-top: 14px; }
.st-stapel .sg { height: 100%; border-radius: 0; display: flex; align-items: center; justify-content: center; font-size: .74rem; font-weight: 600; color: var(--inv); white-space: nowrap; min-width: 4px; border: 0; padding: 0; transition: width .9s cubic-bezier(.2,.8,.2,1), opacity .2s ease; cursor: pointer; }
.st-stapel .sg:first-child { border-radius: 4px 0 0 4px; }
.st-stapel .sg:last-child { border-radius: 0 4px 4px 0; }
.st-stapel .sg:only-child { border-radius: 4px; }
.st-stapel .sg.c3 { color: var(--ink); }
.st-stapel .sg.cx { color: var(--muted); }
.st-stapel:has(.sel) .sg:not(.sel) { opacity: .45; }
.st-leg { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: .76rem; color: var(--muted); }
.st-leg span { display: inline-flex; align-items: center; gap: 6px; }
.st-leg b { color: var(--ink); font-weight: 600; }
.st-leg i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: 0 0 auto; }
.st-leg i.rund { border-radius: 50%; }
.st-leg i.leer { box-shadow: inset 0 0 0 1px var(--line2); }
.st-leg i.spur { background: var(--fill2); box-shadow: inset 0 0 0 1px var(--line2); }
.st-leg i.band { background: rgba(250,250,250,.08); box-shadow: inset 0 0 0 1px var(--line2); }
.st-leg i.linie { height: 0; border-top: 1.5px dashed #8A8A8A; border-radius: 0; width: 14px; }
.st-leg i.linie.hell { border-top: 2px solid #6A6A6A; }
.st-leg i.halb { background: linear-gradient(to top, var(--ink) 50%, transparent 50%); box-shadow: inset 0 0 0 1px var(--ink); }
.st-kacheln { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.st-kacheln.innen { margin: 16px 0 0; }
.st-kacheln > div { border: 1px solid var(--line); border-radius: 12px; padding: 12px 11px 11px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.st-kacheln b { font-size: 1.22rem; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.st-kacheln b small { font-size: .74rem; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.st-kacheln span { font-size: .7rem; color: var(--muted); line-height: 1.3; }
/* Kalender */
.st-kal { display: flex; flex-direction: column; gap: 4px; }
.st-kw, .st-kr { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.st-kw span { text-align: center; font-size: .66rem; color: var(--faint); padding-bottom: 2px; }
.st-c { aspect-ratio: 1; max-height: 34px; width: 100%; border-radius: 6px; border: 0; padding: 0; background: transparent; box-shadow: inset 0 0 0 1px var(--line); justify-self: center; transition: transform .12s ease; }
.st-c.komplett { background: var(--ink); box-shadow: none; }
.st-c.teil { background: linear-gradient(to top, var(--ink) 50%, transparent 50%); box-shadow: inset 0 0 0 1px var(--ink); }
.st-c.verpasst { background: repeating-linear-gradient(135deg, #5A5A5A 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px #4A4A4A; }
.st-c.vor, .st-c.zu { box-shadow: none; background: transparent; }
.st-c.vor { background: var(--hair); }
.st-c.heute { box-shadow: inset 0 0 0 1.5px var(--muted); }
.st-c.jetzt { outline: 2px solid var(--ink); outline-offset: 2px; }
.st-c.sel { transform: scale(1.12); }
/* Zeilen mit Balken */
.st-z { padding: 9px 0; border-top: 1px solid var(--hair); }
.st-z:first-child, .st-unterlab + .st-z { border-top: 0; }
.st-zk { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; }
.st-zk span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-zk b { font-weight: 600; white-space: nowrap; font-size: .86rem; }
.st-z .tb-bar { margin-top: 8px; height: 5px; }
.st-z .tb-bar i { background: var(--ink); }
.st-zs { font-size: .74rem; color: var(--faint); margin-top: 6px; }
.st-li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--hair); }
.st-li .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.st-li .t b { font-weight: 500; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-li .t span { font-size: .78rem; color: var(--muted); line-height: 1.35; }
.st-li .tb-img { width: 38px; height: 38px; border-radius: 10px; }
.st-wert { font-weight: 600; font-size: .88rem; white-space: nowrap; }
/* Kraft */
.st-kr-z { display: grid; grid-template-columns: minmax(0, 1fr) 84px 58px; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--hair); cursor: pointer; }
.st-kr-z:first-child { border-top: 0; }
.st-kr-z .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.st-kr-z .t b { font-weight: 500; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-kr-z .t span { font-size: .76rem; color: var(--muted); line-height: 1.35; }
.st-spark { width: 84px; height: 28px; overflow: visible; }
.st-spark polyline { fill: none; stroke: #8A8A8A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.st-spark circle { fill: var(--ink); stroke: var(--bg); stroke-width: 2; }
.st-delta { justify-self: end; font-size: .8rem; font-weight: 600; padding: 4px 8px; border-radius: 7px; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line2); white-space: nowrap; }
.st-delta.hoch { background: var(--ink); color: var(--inv); box-shadow: none; }
.st-kr-z.sel .t b { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line2); }
/* Säulen */
.st-chart { position: relative; }
.st-saeulen { position: relative; display: flex; align-items: flex-end; gap: 6px; height: 120px; }
.st-saeulen.eng { gap: 3px; }
.st-s { position: relative; flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; justify-content: center; border: 0; background: transparent; padding: 0; }
.st-s i { position: relative; display: block; width: 100%; max-width: 24px; border-radius: 4px 4px 0 0; background: #8A8A8A; transition: height .9s cubic-bezier(.2,.8,.2,1), opacity .2s ease; z-index: 1; }
.st-saeulen:not(.eng) .st-s i { background: var(--ink); }
.st-s.ok i { background: var(--ink); }
.st-s.cheat i { background: repeating-linear-gradient(135deg, #6A6A6A 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px #6A6A6A; }
.st-s .spur { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 24px; border-radius: 4px 4px 0 0; background: var(--fill2); }
.st-saeulen:has(.sel) .st-s:not(.sel) i { opacity: .4; }
.st-ziellinie { position: absolute; left: 0; right: 0; border-top: 1.5px dashed #8A8A8A; z-index: 2; pointer-events: none; }
.st-achse { display: flex; justify-content: space-between; margin-top: 7px; font-size: .68rem; color: var(--faint); font-variant-numeric: tabular-nums; }
/* Abweichung vom Ziel */
.st-div { position: relative; height: 168px; padding-left: 42px; }
.st-band { position: absolute; left: 42px; right: 0; top: calc(50% - var(--band) / 2); height: var(--band); background: rgba(250,250,250,.07); border-radius: 3px; }
.st-null { position: absolute; left: 42px; right: 0; top: 50%; border-top: 1px solid var(--line2); }
.st-y { position: absolute; left: 0; width: 36px; text-align: right; font-size: .66rem; color: var(--faint); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.st-y.o { top: 4px; } .st-y.m { top: 50%; color: var(--muted); } .st-y.u { top: calc(100% - 4px); }
.st-dv-cols { position: relative; display: flex; gap: 3px; height: 100%; }
.st-dv { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; border: 0; padding: 0; background: transparent; }
.st-dv .ob, .st-dv .un { flex: 1; display: flex; justify-content: center; }
.st-dv .ob { align-items: flex-end; } .st-dv .un { align-items: flex-start; }
.st-dv i { display: block; width: 100%; max-width: 24px; transition: height .9s cubic-bezier(.2,.8,.2,1), opacity .2s ease; }
.st-dv .ob i { background: var(--ink); border-radius: 4px 4px 0 0; }
.st-dv .un i { background: #A3A3A3; border-radius: 0 0 4px 4px; }
.st-dv.cheat i { background: repeating-linear-gradient(135deg, #6A6A6A 0 2px, transparent 2px 5px) !important; box-shadow: inset 0 0 0 1px #6A6A6A; }
.st-dv.ohne .ob { position: relative; }
.st-dv.ohne .ob::after { content: ""; position: absolute; bottom: -2.5px; width: 5px; height: 5px; border-radius: 50%; box-shadow: inset 0 0 0 1px #5A5A5A; background: var(--bg); }
.st-dv-cols:has(.sel) .st-dv:not(.sel) i { opacity: .4; }
/* Gewicht */
.st-line { display: block; width: 100%; height: auto; overflow: visible; }
.st-line .grid { stroke: var(--hair); stroke-width: 1; }
.st-line text { fill: var(--faint); font-size: 10px; font-family: inherit; font-variant-numeric: tabular-nums; }
.st-line .mess { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.st-line .trend { stroke: #6A6A6A; stroke-width: 2; stroke-linecap: round; }
.st-line .dot { fill: var(--ink); stroke: var(--bg); stroke-width: 2; transition: r .15s ease; }
.st-line .hit { fill: transparent; cursor: pointer; }
.st-line .pt.sel .dot { r: 6.5; }
.st-line .pt.still .dot { opacity: 0; }
.st-line .pt.still.sel .dot { opacity: 1; }
.st-ansicht { margin-bottom: 10px; }
.st-s.laeuft i, .st-dv.laeuft i { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--ink); }
.st-leg i.laeuft { box-shadow: inset 0 0 0 1.5px var(--ink); }
.st-woche { border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; }
.st-wk { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 14px 16px 4px; }
.st-wk b { font-size: 1rem; font-weight: 600; }
.st-wk span { font-size: .78rem; color: var(--muted); }
.st-ws { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 2px 16px 12px; font-size: .76rem; color: var(--muted); border-bottom: 1px solid var(--line); }
.st-tag { border-top: 1px solid var(--hair); }
.st-tag:first-of-type { border-top: 0; }
.st-tag > summary { display: flex; align-items: center; gap: 12px; padding: 11px 16px; cursor: pointer; list-style: none; min-height: 54px; }
.st-tag > summary::-webkit-details-marker { display: none; }
.st-tag > summary::after { content: "+"; margin-left: auto; color: var(--faint); flex: 0 0 auto; padding-left: 6px; }
.st-tag[open] > summary::after { content: "−"; }
.st-tag[open] > summary { background: var(--fill); }
.st-tag.heute .st-dat b { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line2); }
.st-dat { display: flex; flex-direction: column; width: 44px; flex: 0 0 auto; line-height: 1.2; }
.st-dat b { font-weight: 600; font-size: .92rem; }
.st-dat small { font-size: .72rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.st-bs { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.st-b { font-size: .72rem; padding: 3px 7px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line2); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.st-b.komplett { background: var(--ink); color: var(--inv); box-shadow: none; font-weight: 600; }
.st-b.teil { box-shadow: inset 0 0 0 1px var(--ink); color: var(--ink); }
.st-b.verpasst { background: repeating-linear-gradient(135deg, #3A3A3A 0 2px, transparent 2px 5px); color: var(--ink); }
.st-b.leer { box-shadow: none; color: var(--faint); padding-left: 0; }
.st-inh { padding: 4px 16px 14px; background: var(--fill); }
.st-det { padding-top: 12px; }
.st-det .lab { margin-bottom: 6px; }
.st-dz { display: flex; flex-direction: column; gap: 2px; margin: 8px 0 2px; }
.st-dz b { font-weight: 600; font-size: .88rem; }
.st-dz span { font-size: .76rem; color: var(--muted); }
.st-dr { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); font-size: .82rem; }
.st-dr > span:first-child { min-width: 0; }
.st-dr > span:first-child small { color: var(--faint); }
.st-dr > span:last-child { text-align: right; color: var(--muted); }
.st-dr.fehlt > span:last-child { color: var(--ink); }
.st-dp { margin: 4px 0 0; font-size: .82rem; color: var(--muted); line-height: 1.45; }
.st-dn { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 2px 0 6px; }
.st-dn div { display: flex; flex-direction: column; gap: 1px; }
.st-dn b { font-size: 1rem; font-weight: 600; }
.st-dn span { font-size: .66rem; color: var(--muted); line-height: 1.25; }
.st-tab { margin-top: 10px; }
.st-tab summary { cursor: pointer; font-size: .8rem; color: var(--muted); min-height: 36px; display: flex; align-items: center; list-style: none; }
.st-tab summary::-webkit-details-marker { display: none; }
.st-tab summary::before { content: "+"; width: 16px; color: var(--faint); }
.st-tab[open] summary::before { content: "−"; }
.st-tab table { font-size: .82rem; }
.st-tab th { text-align: left; font-weight: 500; color: var(--faint); font-size: .72rem; padding: 4px 0; }
.st-tab th + th, .st-tab td + td { text-align: right; }
.st-s, .st-dv, .st-c, .st-kr-z, .st-stapel .sg { -webkit-tap-highlight-color: transparent; }

/* Wochenbericht: Statusfarben nur für gut, knapp, Baustelle, immer mit Zeichen und Wort */
.wb-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.wb-nav > div { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.25; }

.wb-z .t span { font-size: .78rem; color: var(--muted); }

.wb-wort { font-size: .78rem; color: var(--muted); flex: 0 0 auto; }

.wb-ziel { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--fill); font-size: .86rem; line-height: 1.45; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.wb-ziel b { font-weight: 600; }
.wb-r { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--hair); }

.wb-r .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

.wb-pokal { width: 38px; height: 38px; border-radius: 11px; background: rgba(250,178,25,.14); color: var(--knapp); display: flex; align-items: center; justify-content: center; font-size: 1.15rem; flex: 0 0 auto; }

.st-kopfzahl { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }

.st-kopfzahl span { font-size: .82rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .wb-ring .fg { transition: none; } }

/* Statistik im Stil von Samsung Health: gefüllte Flächen, grosse Zahlen, eine Farbe pro Bereich */
.sh-ic { width: 30px; height: 30px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
  color: var(--mf); background: rgba(255,255,255,.06); background: color-mix(in srgb, var(--mf) 17%, transparent); }
.sh-heute, .sh-train, .sh-tile, .sh-haupt, .sh-wo { background: var(--fill); border-color: var(--hair); border-radius: 20px; }
.sh-heute { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; padding: 18px 16px 18px 18px; }
.sh-ringe { width: clamp(112px, 33vw, 138px); aspect-ratio: 1; }
.sh-ringe svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
.sh-ringe circle { fill: none; stroke-width: 10.5; stroke-linecap: round; }
.sh-ringe .bg { stroke: var(--rc); stroke-opacity: .17; }
.sh-ringe .fg { stroke: var(--rc); transition: stroke-dasharray 1s cubic-bezier(.2,.8,.2,1); }
.sh-ringe .fg.null { stroke-opacity: 0; }
.sh-hl { min-width: 0; display: flex; flex-direction: column; }
.sh-hl .lab { margin-bottom: 4px; }
.sh-hr { display: grid; grid-template-columns: 10px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 9px; align-items: center; text-align: left;
  border: 0; background: transparent; padding: 7px 0; color: var(--ink); font: inherit; border-top: 1px solid var(--line); }
.sh-hl .lab + .sh-hr { border-top: 0; }
.sh-hr i { width: 10px; height: 10px; border-radius: 50%; background: var(--mf); grid-row: 1; }
.sh-hr span { font-size: .78rem; color: var(--muted); grid-row: 1; }
.sh-hr b { grid-column: 2; font-size: 1.15rem; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-hr b small { font-size: .78rem; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.sh-hr b.leise { font-size: .92rem; color: var(--mf); font-weight: 600; }
.sh-wo { margin-bottom: 12px; }
.sh-train { width: 100%; text-align: left; color: var(--ink); font: inherit; display: flex; flex-direction: column; gap: 3px; padding: 16px 16px 14px; }
.sh-train .k, .sh-tile .k { display: flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 600; }
.sh-train .k .r { margin-left: auto; font-size: .76rem; color: var(--muted); font-weight: 500; }
.sh-tw { font-size: 2.2rem; font-weight: 600; letter-spacing: -.035em; line-height: 1.1; margin-top: 8px; }
.sh-tw small, .sh-tile .w small { font-size: .82rem; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 5px; }
.sh-train > .s, .sh-tile .s { font-size: .78rem; color: var(--muted); line-height: 1.4; }
.sh-tcols { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.sh-tcols > span { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.sh-tcols .b { position: relative; height: 64px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.sh-tcols .b::before { content: ""; position: absolute; bottom: 0; width: 100%; max-width: 24px; height: 3px; border-radius: 2px; background: var(--fill2); }
.sh-tcols .sp { position: absolute; bottom: 0; width: 100%; max-width: 24px; border-radius: 4px 4px 0 0; background: var(--mf); opacity: .2; }
.sh-tcols .verpasst .sp { opacity: 1; background: repeating-linear-gradient(135deg, var(--mf) 0 2px, transparent 2px 6px); opacity: .55; }
.sh-tcols i { position: relative; z-index: 1; display: block; width: 100%; max-width: 24px; border-radius: 4px 4px 0 0; background: var(--mf); transition: height .9s cubic-bezier(.2,.8,.2,1); }
.sh-tcols em { font-style: normal; font-size: .68rem; color: var(--faint); }
.sh-tcols .jetzt em { color: var(--ink); font-weight: 600; }
.sh-tleg, .sh-cleg { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: .72rem; color: var(--faint); }
.sh-tleg span, .sh-cleg span { display: inline-flex; align-items: center; gap: 6px; }
.sh-tleg i, .sh-cleg i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; background: var(--mf); }
.sh-tleg i.sp, .sh-cleg i.sp { opacity: .25; }
.sh-tleg i.x, .sh-cleg i.ch { background: repeating-linear-gradient(135deg, var(--mf) 0 2px, transparent 2px 4px); }
.sh-cleg i.lf { background: transparent; box-shadow: inset 0 0 0 1.5px var(--mf); }
.sh-cleg i.spanne { width: 6px; height: 14px; }
.sh-cleg i.pkt { border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--mf); width: 8px; height: 8px; }
.sh-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 12px 0; }
.sh-tile { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 14px 13px 12px; min-height: 162px; border: 1px solid var(--hair); color: var(--ink); font: inherit; min-width: 0; }
.sh-tile .k { font-size: .86rem; gap: 7px; }
.sh-tile .k .sh-ic { width: 26px; height: 26px; border-radius: 8px; }
.sh-tile .w { font-size: 1.6rem; font-weight: 600; letter-spacing: -.025em; line-height: 1.12; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.sh-tile .w small { margin-left: 3px; }
.sh-tile .w.leise { font-size: 1.05rem; color: var(--mf); font-weight: 600; letter-spacing: 0; margin-top: 12px; }
.sh-mini { margin-top: auto; padding-top: 10px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; height: 50px; align-items: end; }
.sh-mini > span { position: relative; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
.sh-mini > span::before { content: ""; position: absolute; bottom: 0; width: 100%; max-width: 10px; height: 3px; border-radius: 2px; background: var(--fill2); }
.sh-mini i { position: relative; z-index: 1; display: block; width: 100%; max-width: 10px; border-radius: 3px 3px 0 0; background: var(--mf); opacity: .5; transition: height .9s cubic-bezier(.2,.8,.2,1); }
.sh-mini .jetzt i { opacity: 1; }
.sh-mini .laeuft i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--mf); opacity: 1; }
.sh-mini .cheat i { background: repeating-linear-gradient(135deg, var(--mf) 0 2px, transparent 2px 4px); }
.sh-mini .zu::before { opacity: .4; }
.sh-mini-x { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 5px; font-size: .6rem; color: var(--faint); text-align: center; }
.sh-mini-x .jetzt { color: var(--ink); font-weight: 700; }
.sh-unten { margin-top: auto; padding-top: 10px; display: block; }
.sh-spark { display: block; width: 100%; height: 36px; overflow: visible; }
.sh-spark polyline { fill: none; stroke: var(--mf); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.sh-spark circle { fill: var(--mf); stroke: var(--fill); stroke-width: 2; }
.sh-badge { margin-top: auto; align-self: flex-start; white-space: nowrap; font-size: .72rem; font-weight: 600; padding: 4px 8px; border-radius: 7px; color: #0b0b0b; background: var(--mf); }
.sh-tile:active, .sh-train:active, .sh-wo:active, .sh-hr:active { transform: scale(.98); }
.sh-tile, .sh-train, .sh-wo, .sh-hr { transition: transform .12s ease; }
.sh-hinweis { font-size: .86rem; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; border-color: #6B2B2B; }

/* Detailseite */
.sh-kopf { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
.sh-zur { display: inline-flex; align-items: center; gap: 2px; height: 40px; padding: 0 12px 0 6px; border-radius: 12px; border: 1px solid var(--line2); background: transparent; color: var(--ink); font-size: .88rem; font-weight: 500; }
.sh-kopf h2 { flex: 1; min-width: 0; margin: 0; display: flex; align-items: center; justify-content: flex-end; gap: 10px; font-size: 1.15rem; font-weight: 600; }
.sh-modus { margin-bottom: 10px; }
.sh-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.sh-nav span { flex: 1; text-align: center; font-weight: 600; font-size: .92rem; }
.sh-nav .iconbtn[disabled] { opacity: .22; pointer-events: none; }
.sh-haupt { padding: 18px 16px 14px; }
.sh-gl { font-size: .82rem; color: var(--muted); }
.sh-gw { font-size: 2.7rem; font-weight: 600; letter-spacing: -.035em; line-height: 1.08; margin-top: 4px; }
.sh-gw small { font-size: .95rem; color: var(--muted); font-weight: 500; letter-spacing: 0; margin: 0 6px 0 4px; }
.sh-gw.leer { font-size: 1.5rem; color: var(--muted); font-weight: 500; letter-spacing: -.01em; margin-top: 8px; }
.sh-gs { font-size: .86rem; color: var(--muted); margin-top: 4px; line-height: 1.45; min-height: 1.3em; }
.sh-chart { position: relative; height: 200px; margin-top: 18px; }
.sh-fl { position: absolute; left: 0; right: 42px; top: 4px; bottom: 24px; }
.sh-fl .gl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--hair); }
.sh-fl .gl.null { border-top-color: var(--line2); }
.sh-fl .gl span { position: absolute; left: calc(100% + 8px); top: -.62em; font-size: .66rem; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sh-fl .zl { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--mf); z-index: 2; pointer-events: none; }
.sh-fl .zl span { position: absolute; left: calc(100% + 8px); top: -.65em; font-size: .66rem; font-weight: 600; color: var(--mf); }
.sh-cols { position: absolute; left: 0; right: 42px; top: 4px; bottom: 0; display: flex; gap: 6px; }
.sh-col { flex: 1; min-width: 0; display: flex; flex-direction: column; border: 0; background: transparent; padding: 0; color: inherit; font: inherit; }
.sh-col[disabled] { cursor: default; }
.sh-col .sh-bar { position: relative; flex: 1; display: flex; align-items: flex-end; justify-content: center; }
.sh-col i { position: relative; z-index: 1; display: block; width: 100%; max-width: 24px; border-radius: 4px 4px 0 0; background: var(--mf); opacity: .4; transition: height .7s cubic-bezier(.2,.8,.2,1), opacity .2s ease; }
.sh-col.sel i { opacity: 1; }
.sh-col .sh-spur { position: absolute; bottom: 0; width: 100%; max-width: 24px; border-radius: 4px 4px 0 0; background: var(--mf); opacity: .16; }
.sh-col.verpasst .sh-spur { background: repeating-linear-gradient(135deg, var(--mf) 0 2px, transparent 2px 6px); opacity: .5; }
.sh-col.laeuft i { background: transparent; box-shadow: inset 0 0 0 2px var(--mf); opacity: .7; }
.sh-col.laeuft.sel i { opacity: 1; }
.sh-col.cheat i { background: repeating-linear-gradient(135deg, var(--mf) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--mf); }
.sh-col.leer .sh-bar::after { content: ""; position: absolute; bottom: -3px; width: 6px; height: 6px; border-radius: 50%; box-shadow: inset 0 0 0 1px #5A5A5A; background: var(--fill); }
.sh-col em { font-style: normal; height: 24px; display: flex; align-items: flex-end; justify-content: center; font-size: .7rem; color: var(--faint); white-space: nowrap; }
.sh-col.sel em { color: var(--ink); font-weight: 700; }
.sh-chart.spanne .sh-bar { display: block; }
.sh-chart.spanne i { position: absolute; left: 50%; transform: translateX(-50%); width: 100%; max-width: 14px; border-radius: 7px; opacity: .45; }
.sh-chart.spanne .sel i { opacity: 1; }
.sh-chart.spanne .sh-bar b { position: absolute; left: 50%; width: 8px; height: 8px; margin: 0 0 -4px -4px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--mf); z-index: 2; opacity: .55; }
.sh-chart.spanne .sel b { opacity: 1; }
.sh-lab { margin: 18px 2px 8px; }
.sh-tagkarte .sh-tk { font-weight: 600; font-size: .98rem; }
.sh-tagkarte .st-det:first-of-type { padding-top: 8px; }
.sh-tz { width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 0; border: 0; border-top: 1px solid var(--hair); background: transparent; color: var(--ink); font: inherit; text-align: left; }
.st-kopf + .sh-tz { border-top: 0; }
.sh-tz .d { display: flex; flex-direction: column; line-height: 1.2; }
.sh-tz .d b { font-weight: 600; font-size: .9rem; }
.sh-tz .d small { font-size: .7rem; color: var(--faint); }
.sh-tz .bar { position: relative; height: 8px; border-radius: 4px; background: var(--fill2); }
.sh-tz .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--mf); }
.sh-tz.laeuft .bar i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--mf); }
.sh-tz.cheat .bar i { background: repeating-linear-gradient(135deg, var(--mf) 0 2px, transparent 2px 5px); }
.sh-tz .bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); opacity: .55; border-radius: 1px; }
.sh-tz .w { font-size: .84rem; font-weight: 600; white-space: nowrap; text-align: right; }
.sh-verb { text-align: left; }
.sh-verb h3 { margin: 12px 0 0; }
.sh-verb .sh-ic { width: 44px; height: 44px; border-radius: 14px; }
.sh-verb .sh-ic svg { width: 24px; height: 24px; }
/* In einer Detailseite übernehmen die alten Bausteine die Farbe des Bereichs */
.sh-det .st-k, .sh-det .sh-tagkarte { background: var(--fill); border-color: var(--hair); border-radius: 20px; }
.sh-det .st-z .tb-bar i, .sh-det .st-saeulen .st-s i, .sh-det .st-saeulen:not(.eng) .st-s i { background: var(--mf); }
.sh-det .st-stapel .sg.c1, .sh-det .st-leg i.c1 { background: var(--mf); color: #0b0b0b; }
.sh-det .st-line .mess { stroke: var(--mf); }
.sh-det .st-line .dot { fill: var(--mf); stroke: var(--fill); }
.sh-det .st-spark polyline { stroke: var(--mf); }
.sh-det .st-spark circle { fill: var(--mf); stroke: var(--fill); }
.sh-det .st-delta.hoch { background: var(--mf); color: #0b0b0b; }
.sh-det .st-inh { background: transparent; }
.wb-ohne { margin: 0; padding: 10px 0 12px; border-top: 1px solid var(--hair); font-size: .8rem; color: var(--muted); line-height: 1.45; }
.wb-ampel .wb-ohne:first-child { border-top: 0; }

/* ======================================================= Bewegung
   Kurz, ruhig, mit Zweck: Eintritt beim Tab Wechsel, Blätter von unten, Druck Feedback, Haken, Fortschritt.
   Wer im System weniger Bewegung eingestellt hat, bekommt keine. */
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
@keyframes rein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes blattHoch { from { transform: translateY(100%); } to { transform: none; } }
@keyframes blattRunter { from { transform: none; } to { transform: translateY(100%); } }
@keyframes einblenden { from { opacity: 0; } to { opacity: 1; } }
@keyframes ausblenden { from { opacity: 1; } to { opacity: 0; } }
@keyframes hak { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }

    return new Promise(res => {
      try {
        const r = indexedDB.open('fitapp', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  async get(k) {
    const db = this.db || await this.open(); if (!db) return null;
    return new Promise(res => { try { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result == null ? null : q.result); q.onerror = () => res(null); } catch (e) { res(null); } });
  },
  async set(k, v) {
    const db = this.db || await this.open(); if (!db) return false;
    return new Promise(res => { try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); } });
  }
};

/* Alte gespeicherte Pläne (ohne Version) auf den neuen Stand bringen, eigene Änderungen bleiben */
function migratePlan(p) {
  if (!p || !Array.isArray(p.days) || !p.days.length) return clone(DEFAULT_PLAN);
  if ((p.v || 1) >= PLAN_V) return p;
  DEFAULT_PLAN.days.forEach((dd, di) => {
    const d = p.days.find(x => x.id === dd.id);
    if (!d) { p.days.splice(Math.min(di, p.days.length), 0, clone(dd)); return; }
    d.wds = dd.wds.slice(); delete d.wd;
    d.ex.forEach(ex => {
      const de = dd.ex.find(x => x.id === ex.id);
      if (ex.kg == null) ex.kg = de ? !!de.kg : false;
      if (ex.soll == null && de) ex.soll = de.soll;
      if (ex.kgSoll == null && de && de.kgSoll) ex.kgSoll = de.kgSoll;
    });
  });
  p.days.forEach(d => { if (!d.wds) { d.wds = d.wd != null ? [d.wd] : []; delete d.wd; } d.ex.forEach(ex => { if (ex.kg == null) ex.kg = false; }); });
  /* Version 3: Tag A war zu lang für 32 Minuten, wird durch die neue Fassung ersetzt */
  if ((p.v || 1) < 3) { const i = p.days.findIndex(x => x.id === 'A'); if (i >= 0) p.days[i] = clone(DEFAULT_PLAN.days.find(x => x.id === 'A')); }
  /* Version 5: Aufwärmen und Nacken in jedem Training, Joggen wird Beweglichkeit, Videos zu jeder Übung */
  /* Version 7: Bilder für alle Übungen, Teile für den geführten Timer */
  if ((p.v || 1) < 7) ['A', 'B', 'C', 'J', 'L', 'M'].forEach(id => { const i = p.days.findIndex(x => x.id === id); if (i >= 0) p.days[i] = clone(DEFAULT_PLAN.days.find(x => x.id === id)); });
  /* Version 4: Tag B, Tag C und Joggen ebenfalls auf unter 30 Minuten gebracht */
  if ((p.v || 1) < 4) ['B', 'C', 'J'].forEach(id => { const i = p.days.findIndex(x => x.id === id); if (i >= 0) p.days[i] = clone(DEFAULT_PLAN.days.find(x => x.id === id)); });
  /* Version 8: Rudern an Tag A (Gleichgewicht Drücken und Ziehen), Ausfallschritte mit Spanne für die Steigerung */
  if ((p.v || 1) < 8) {
    const a = p.days.find(x => x.id === 'A');
    if (a && !a.ex.some(x => x.id === 'a8')) { const i = a.ex.findIndex(x => x.id === 'a5'); a.ex.splice(i >= 0 ? i : a.ex.length, 0, clone(DEFAULT_PLAN.days[0].ex.find(x => x.id === 'a8'))); }
    const c = p.days.find(x => x.id === 'C'); const c3 = c && c.ex.find(x => x.id === 'c3'); if (c3 && c3.ziel === '10 pro Bein') c3.ziel = '10 bis 12 pro Bein';
  }
  p.v = PLAN_V;
  return p;
}
function loadPlan() { const p = migratePlan(LS.get('plan', null)); LS.set('plan', p); return p; }
let plan = loadPlan();
let sessions = LS.get('sess', {});
let history = LS.get('history', []);
let editMode = false;

function savePlan() { LS.set('plan', plan); }
function saveSessions() { LS.set('sess', sessions); }

function dayById(id) { return plan.days.find(d => d.id === id) || plan.days[0]; }
const PFLICHT = ['A', 'B', 'C'];
function wochenStart() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }
/* Pflichttage, die diese Woche noch nicht gespeichert sind */
function offenePflicht() {
  const ab = wochenStart().getTime();
  const fertig = new Set(history.filter(h => new Date(h.date).getTime() >= ab).map(h => h.dayId));
  return PFLICHT.filter(id => !fertig.has(id) && plan.days.some(d => d.id === id));
}
/* Welcher Tag laut Stundenplan heute dran ist */
function planDayId() {
  const wd = new Date().getDay();
  if (wd === 0) { const o = offenePflicht(); if (o.length) return o[0]; }
  const d = plan.days.find(x => (x.wds || []).indexOf(wd) >= 0);
  return d ? d.id : plan.days[0].id;
}
function todayDayId() {
  /* angefangenes Training geht vor */
  const aktiv = Object.keys(sessions).find(id => plan.days.some(d => d.id === id) && Object.values(sessions[id].sets || {}).some(a => a.some(x => x.d)));
  return aktiv || planDayId();
}
let curDay = todayDayId();

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || curDayDate === new Date().toDateString()) return;
  curDayDate = new Date().toDateString(); alteTrainingsSichern(); curDay = todayDayId();

function lastValues(exId, i) {
  for (let h = history.length - 1; h >= 0; h--) {
    const e = (history[h].ex || []).find(x => x.id === exId);
    if (e && e.sets && e.sets.length) {
      const s = e.sets[i] || e.sets[e.sets.length - 1];
      return { w: s.w || '', r: s.r || '' };
    }
  }
  return { w: '', r: '' };
}

   oder die schwerere Variante und wieder unten anfangen. Ohne steigende Last wächst kein Muskel. */
const STEIG = {
  a1: { rmin: 8, rmax: 12, stufe: 'Füsse aufs Bett legen' }, c2: { rmin: 8, rmax: 12, stufe: 'Füsse aufs Bett legen' },

  a8: { rmin: 10, rmax: 12, kg: 1 }, b2: { rmin: 10, rmax: 12, kg: 1 }, b3: { rmin: 10, rmax: 12, kg: 1 }, c4: { rmin: 10, rmax: 12, kg: 1 }, c1: { rmin: 12, rmax: 15, kg: 1 },
  b1: { rmin: 8, rmax: 10, stufe: 'Rucksack auf den Rücken' }, b4: { rmin: 15, rmax: 20, stufe: 'einbeinige Bridge' },
  c3: { rmin: 10, rmax: 12, stufe: 'Rucksack auf den Rücken' }, c5: { rmin: 12, rmax: 15, stufe: 'Beine langsamer senken, 3 s runter' }
};
function letzteUebung(exId) {
  for (let h = history.length - 1; h >= 0; h--) { const e = (history[h].ex || []).find(x => x.id === exId); if (e && e.sets && e.sets.length) return e; }
  return null;
}
function steigerung(ex) {
  const st = STEIG[ex.id]; if (!st || ex.einheit !== 'Wdh') return null;
  const e = letzteUebung(ex.id); if (!e) return null;
  const rs = e.sets.map(x => parseInt(x.r, 10) || 0);
  const w = ex.kg ? parseFloat(String(e.sets[0].w || '').replace(',', '.')) : NaN;

      const n = naechsterSatz(day, ex.id, i);
      if (ex.pause > 0 && n) Timer.setze([{ typ: 'pause', sek: ex.pause, day: day.id, ex: ex.id, exName: ex.name, satz: i, saetze: ex.sets }]);
      requestWake();
    } else if (p && p.ex === ex.id && p.satz === i) Timer.ende();
    renderTraining(); Timer.markiere();
    if (st.d) { const nb = $(`[data-ex="${ex.id}"] [data-act="toggle"][data-i="${b.dataset.i}"]`); if (nb) nb.classList.add('pop'); }
  } else if (act === 'detail' && ex) openUebung(ex);
  else if (act === 'finish') abschliessenFragen();
  else if (act === 'history') openHistory();
  else if (act === 'stats') zeigeStats('training');
  else if (act === 'edit') { editMode = true; renderTraining(); }
  else if (act === 'editdone') { editMode = false; savePlan(); renderTraining(); toast('Plan gespeichert'); }
  else if (act === 'addex') {
    day.ex.push({ id: 'x' + Date.now().toString(36), name: 'Neue Übung', sets: 3, ziel: '', pause: 60, einheit: 'Wdh', soll: 10, kg: false, how: '', easy: '' });
    savePlan(); renderTraining();
  } else if (act === 'delex' && ex) {
    if (b.dataset.sure) { day.ex = day.ex.filter(x => x !== ex); savePlan(); renderTraining(); toast('Übung gelöscht'); }
    else { b.dataset.sure = '1'; b.textContent = 'Wirklich löschen? Nochmals tippen'; }
  }
});

function bildHtml(ex, gross) {
  if (!ex.bild && ex.figur && FIGUREN[ex.figur]) return `<span class="pv-fig ${gross ? 'gross' : ''}">${FIGUREN[ex.figur]}</span>`;
  if (!ex.bild) return `<span class="pv-leer">${ICON_HANTEL}</span>`;
  const u = BILD_BASE + encodeURIComponent(ex.bild) + '/';
  return `<span class="pv-anim ${gross ? 'gross' : ''}"><img src="${u}0.jpg" alt="" loading="lazy" decoding="async" onerror="this.closest('.pv-anim').classList.add('kaputt')"><img src="${u}1.jpg" alt="" loading="lazy" decoding="async"></span>`;
}
/* Werte vom letzten Mal, z. B. "10 · 9 · 8" oder "8 kg × 10 · 8 kg × 9" */
function letztesMal(ex) {
  if (ex.einheit === 'Min') return '';
  for (let i = history.length - 1; i >= 0; i--) {
    const e = (history[i].ex || []).find(x => x.id === ex.id);
    if (e && e.sets && e.sets.length) {
      const eh = ex.einheit === 'Sek' ? ' s' : '';
      const t = e.sets.map(st => (ex.kg && st.w ? st.w + ' kg × ' : '') + (st.r || '?') + eh).join(' · ');
      const d = new Date(history[i].date);
      return t + ' (' + d.getDate() + '.' + (d.getMonth() + 1) + '.)';
    }
  }
  return '';
}
/* Geschätzte Dauer: Satzzeit plus Pausen plus Wechsel zwischen den Übungen */
function dauerMin(day) {
  let t = 0;
  day.ex.forEach((x, i) => {
    const per = /pro (Bein|Seite)/.test(x.ziel || '') ? 2 : 1;
    const satz = x.einheit === 'Min' ? (x.soll || 1) * 60 : x.einheit === 'Sek' ? ((x.soll || 30) + 10) * per * (/2 Mal/.test(x.ziel || '') ? 2 : 1) : (/Zirkel/.test(x.name) ? 100 : 40 * per);
    t += x.sets * satz + (x.sets - 1) * (x.pause || 0) + (i ? 30 : 0);
  });
  return Math.max(1, Math.round(t / 60));
}

/* Vorschau: YouTube Suche mit englischem Suchbegriff, eigene Übungen über ihren Namen */
function videoLink(ex) {

/* Ein Training speichern, auch wenn nicht alle Sätze gemacht sind. Gespeichert wird das Soll pro Übung,
   damit die Statistik genau weiss, was ausgelassen wurde. */
function trainingSpeichern(day, s, opt) {
  opt = opt || {};
  const saetze = x => s.sets[x.id] || [];
  const ex = day.ex.map(x => ({ id: x.id, name: x.name, einheit: x.einheit,
    sets: saetze(x).filter(st => st.d).map(st => ({ w: x.kg ? st.w : '', r: st.r })) })).filter(x => x.sets.length);
  if (!ex.length) return null;
  const soll = day.ex.reduce((a, x) => a + x.sets, 0);
  const fertig = day.ex.reduce((a, x) => a + saetze(x).filter(st => st.d).length, 0);
  const min = !opt.auto && s.t0 ? Math.round((Date.now() - s.t0) / 60000) : null;
  const e = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), date: new Date(opt.datum || Date.now()).toISOString(), start: s.start, dayId: day.id, dayName: day.name + ': ' + day.title, ex, voll: fertig >= soll, soll, fertig,
    plan: day.ex.map(x => ({ id: x.id, name: x.name, sets: x.sets, einheit: x.einheit })), min: min != null && min > 0 && min < 180 ? min : null, auto: !!opt.auto };
  history.push(e);
  if (!LS.set('history', history)) { history.pop(); return null; }
  delete sessions[day.id]; saveSessions();
  return e;
}
/* Nicht abgeschlossene Trainings von früheren Tagen werden nicht vergessen: mit mindestens einem Satz automatisch gespeichert */
function alteTrainingsSichern() {
  const heute = tagKey(new Date()); const gesichert = [];
  Object.keys(sessions).forEach(id => {
    const s = sessions[id]; const day = plan.days.find(d => d.id === id);
    const t = s.t0 || (s.start ? new Date(s.start).getTime() : Date.now());
    if (tagKey(new Date(t)) >= heute) return;
    const hatSatz = day && Object.values(s.sets || {}).some(a => (a || []).some(x => x.d));
    const e = hatSatz ? trainingSpeichern(day, s, { datum: t, auto: true }) : null;
    if (e) gesichert.push(e); else { delete sessions[id]; saveSessions(); }
  });
  if (gesichert.length) {
    const e = gesichert[gesichert.length - 1];
    toast(`Training vom ${new Date(e.date).toLocaleDateString('de-CH', { weekday: 'long' })} gespeichert: ${e.fertig} von ${e.soll} Sätzen`);
    try { streakAnsWidget(); } catch (er) {}
  }
  return gesichert.length;
}
/* Abschliessen geht jederzeit. Fehlt noch etwas, zeigt die App vorher genau was. */
function abschliessenFragen() {
  const day = dayById(curDay); const s = sessionFor(day);
  const soll = day.ex.reduce((a, x) => a + x.sets, 0);
  const fertig = day.ex.reduce((a, x) => a + (s.sets[x.id] || []).filter(st => st.d).length, 0);
  if (!fertig) { toast('Hake zuerst mindestens einen Satz ab.'); return; }
  if (fertig >= soll) { finishTraining(); return; }
  const offen = day.ex.map(x => { const n = (s.sets[x.id] || []).filter(st => !st.d).length; return n ? { n: x.name, t: n >= x.sets ? 'ganz offen' : n + ' von ' + x.sets + ' Sätzen offen' } : null; }).filter(Boolean);
  openSheet('Training abschliessen?', `<p style="margin-top:0">Du hast <b>${fertig} von ${soll} Sätzen</b> gemacht.</p>
    <div class="lab" style="margin-top:14px">Noch offen</div>
    ${offen.map(o => `<div class="st-li"><div class="t"><b>${esc(o.n)}</b></div><span class="small muted">${esc(o.t)}</span></div>`).join('')}
    <p class="small muted" style="margin:14px 0 0">Das Training wird gespeichert und in der Statistik als teilweise gezählt, mit genau diesen offenen Teilen. Für die Streak zählt nur ein komplettes Training.</p>
    <button class="btn primary wide mg-ok" data-x="ja">Abschliessen mit ${fertig} von ${soll}</button>
    <button class="btn wide" data-x="nein" style="margin-top:10px">Weiter trainieren</button>`);
  $('#sheetBody').onclick = ev => { const x = ev.target.closest('[data-x]'); if (!x) return; closeSheet(); if (x.dataset.x === 'ja') finishTraining(); };
}
function finishTraining() {
  const day = dayById(curDay); const s = sessionFor(day);
  const vorher = streakInfo();
  const neu = trainingSpeichern(day, s);
  if (!neu) { toast('Noch kein Satz abgehakt'); return; }
  const soll = neu.soll, fertig = neu.fertig;
  Timer.ende(); releaseWake();
  renderTraining();
  const nachher = streakInfo();
  streakAnsWidget();
  if (nachher.heute && !vorher.heute) toast(`Streak ${nachher.streak} ${nachher.streak === 1 ? 'Tag' : 'Tage'}${nachher.freezes > vorher.freezes ? '. Neuer Freeze verdient' : ''}. Gut gemacht.`);
  else if (fertig < soll) toast(`Gespeichert. Für die Streak fehlen ${soll - fertig} ${soll - fertig === 1 ? 'Satz' : 'Sätze'}.`);
  else if (!zaehltFuer(history[history.length - 1])) toast('Gespeichert. Für die Streak zählt heute ' + dayById(planDayId()).name + ' oder ein Pflichttag.');
  else toast('Training gespeichert. Gut gemacht.');
}

/* ======================================================= Streak */
/* Regeln: jeder Tag braucht das Training, das der Plan für diesen Tag vorsieht (oder einen Pflichttag A, B, C),
   und zwar mit allen Sätzen abgehakt. Alle 2 geschaffte Tage gibt es 1 Freeze, höchstens 2 auf Vorrat,
   höchstens 1 pro Tag. Ein verpasster Tag frisst automatisch einen Freeze, ohne Freeze ist die Streak weg. */
const FREEZE_MAX = 2, FREEZE_ALLE = 2;
function tagKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function keyDatum(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); }
function planIdFuer(datum) { const wd = datum.getDay(); const d = plan.days.find(x => (x.wds || []).indexOf(wd) >= 0); return d ? d.id : null; }
function zaehltFuer(h) {
  if (h.voll === false) return false;
  const datum = new Date(h.date);
  return PFLICHT.indexOf(h.dayId) >= 0 || h.dayId === planIdFuer(datum);
}
function streakInfo() {
  const gut = new Set(history.filter(zaehltFuer).map(h => tagKey(new Date(h.date))));
  const heute = tagKey(new Date());
  const res = { streak: 0, best: 0, freezes: 0, fortschritt: 0, heute: gut.has(heute), letzter: '', tage: {}, eingesetzt: [] };
  if (!gut.size) return res;
  const start = Array.from(gut).sort()[0];
  let anzahl = 0;
  for (let d = keyDatum(start); tagKey(d) <= heute; d.setDate(d.getDate() + 1)) {
    const k = tagKey(d);
    if (gut.has(k)) {
      res.streak++; anzahl++; res.letzter = k; res.tage[k] = 'ok';
      if (anzahl % FREEZE_ALLE === 0 && res.freezes < FREEZE_MAX) res.freezes++;
    } else if (k === heute) {
      res.tage[k] = 'offen';
    } else if (res.streak > 0 && res.freezes > 0) {
      res.freezes--; res.tage[k] = 'freeze'; res.eingesetzt.push(k);
    } else {
      if (res.streak > 0) res.tage[k] = 'weg'; else res.tage[k] = 'leer';
      res.streak = 0;
    }
    res.best = Math.max(res.best, res.streak);
  }
  res.fortschritt = res.freezes >= FREEZE_MAX ? FREEZE_ALLE : anzahl % FREEZE_ALLE;
  return res;
}

function streakAnsWidget() {

    const s = streakInfo();

function openHistory() {
  const names = Array.from(new Set(history.flatMap(h => h.ex.map(e => e.name)).concat(plan.days.flatMap(d => d.ex.map(e => e.name)))));
  let sel = LS.get('histEx', names[0] || '');
  if (names.indexOf(sel) < 0) sel = names[0] || '';
  const draw = () => {
    const rows = history.filter(h => h.ex.some(e => e.name === sel)).map(h => ({ h, e: h.ex.find(e => e.name === sel) }));
    const totals = rows.map(r => r.e.sets.reduce((a, s) => a + (parseFloat(r.e.einheit === 'Sek' ? s.r : s.r) || 0), 0));
    const max = Math.max(1, ...totals);
    let b = `<label class="field"><span>Übung</span><select id="histSel">${names.map(n => `<option ${n === sel ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>`;
    if (!rows.length) b += '<div class="empty">Noch kein Training mit dieser Übung gespeichert.</div>';
    else {
      b += `<div class="muted small">Summe pro Training, letzte ${Math.min(16, rows.length)}</div><div class="bars">` +
        totals.slice(-16).map(t => `<i style="height:${Math.round(t / max * 100)}%" title="${t}"></i>`).join('') + '</div>';
      b += rows.slice().reverse().map(r => `<div class="li"><div class="t"><b>${datum(r.h.date)}</b> <span class="muted small">${esc(r.h.dayName)}</span><br>
        <span class="num">${r.e.sets.map(s => `${s.w ? esc(s.w) + ' kg × ' : ''}${esc(s.r || '?')} ${esc(r.e.einheit)}`).join(' · ')}</span></div></div>`).join('');
    }
    b += `<p class="muted small">${history.length} Trainings gespeichert.</p>`;
    $('#sheetBody').innerHTML = b;
    $('#histSel').addEventListener('change', ev => { sel = ev.target.value; LS.set('histEx', sel); draw(); });
  };
  openSheet('Verlauf', ''); draw();
}

function zutatDazu(id) {

  if (zutaten.indexOf(id) >= 0) { toast('Schon drin'); return; }
  zutaten.push(id); saveZutaten(); recLimit = 30; renderVorrat();
}
function zeigeVorschlaege(q) {
  const box = $('#vSugg'); if (!box) return;
  const v = vorschlaege(q);
  const t = normTerm(q);
  box.innerHTML = v.map(id => `<button class="chip" data-add="${id}">+ ${esc(zutName(id))}</button>`).join('')

let suchTimer = null;
