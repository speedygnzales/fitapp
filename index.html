<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FitApp</title>
<style>
:root {
  --bg: #0E0E0E; --fill: #161616; --fill2: #1E1E1E; --line: #262626; --line2: #333333; --hair: #1C1C1C;
  --ink: #FAFAFA; --muted: #A3A3A3; --faint: #8A8A8A; --inv: #0E0E0E;
  --r: 14px; --rs: 10px; --tab-h: 64px; --pill-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.45 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh;
  padding-bottom: calc(var(--tab-h) + var(--safe-b) + 20px); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.lab { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 12px; background: rgba(14,14,14,.94);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
header.top h1 { flex: 1; margin: 0; font-size: 1.4rem; font-weight: 600; letter-spacing: -.01em; }
.iconbtn { width: 44px; height: 44px; border-radius: var(--rs); border: 1px solid var(--line2); background: transparent;
  display: inline-flex; align-items: center; justify-content: center; padding: 0; position: relative; flex: 0 0 auto; }
.badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 6px; background: var(--ink); color: var(--inv);
  font-size: .72rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; box-shadow: 0 0 0 2px var(--bg); }
.badge:empty { display: none; }

main { padding: 14px 20px 16px; max-width: 720px; margin: 0 auto; }
.card { background: transparent; border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
.card h3 { margin: 0 0 4px; font-size: 1.06rem; font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.btn { min-height: 48px; border-radius: var(--rs); border: 1px solid var(--line2); background: transparent; padding: 0 16px; font-weight: 500; }
.btn.primary, .btn.ok { background: var(--ink); border-color: var(--ink); color: var(--inv); font-weight: 600; }
.btn.danger { border-color: #6B2B2B; color: #FF8A8A; }
.btn.wide { width: 100%; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: .9rem; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 20px 14px; margin: 0 -20px; scrollbar-width: none; }
.card .chips { margin: 0; padding: 0; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; min-height: 40px; border-radius: var(--rs); border: 1px solid var(--line2); background: transparent; color: var(--muted);
  padding: 0 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--inv); font-weight: 600; }
.chip .x { opacity: .7; padding-left: 2px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--r); padding: 4px; gap: 4px; margin-bottom: 12px; }
.seg button { flex: 1; min-height: 44px; border: 0; border-radius: var(--rs); background: transparent; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--inv); font-weight: 600; }
input[type=text], input[type=search], input[type=password], input:not([type]), select, input[inputmode] {
  min-height: 48px; border-radius: var(--rs); border: 1px solid var(--line2); background: var(--fill); padding: 0 14px; width: 100%; outline: none; }
input:focus, select:focus { border-color: var(--ink); }
label.field { display: block; margin-bottom: 10px; }
label.field span { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.switch { width: 50px; height: 30px; border-radius: 8px; background: var(--fill2); border: 1px solid var(--line2); position: relative; flex: 0 0 auto; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 5px; background: var(--muted); transition: left .15s, background .15s; }
.switch[aria-checked="true"] { background: var(--ink); border-color: var(--ink); }
.switch[aria-checked="true"]::after { left: 23px; background: var(--inv); }
.note { border: 1px solid var(--line2); border-radius: var(--r); padding: 14px 16px; margin-bottom: 12px; font-size: .92rem; color: var(--muted); }
.note b { color: var(--ink); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }

/* Training */
.daycard { display: flex; align-items: center; gap: 16px; }
.ring { width: 58px; height: 58px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; transition: --p .6s cubic-bezier(.2,.8,.2,1);
  background: conic-gradient(var(--ink) calc(var(--p) * 1%), var(--line) 0); }
.ring span { width: 48px; height: 48px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center;
  font-size: .78rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.daycard h2 { margin: 3px 0 0; font-size: 1.12rem; font-weight: 600; line-height: 1.25; }
.daycard .sub { font-size: .85rem; color: var(--muted); margin-top: 2px; }
.daycard .sub button { border: 0; background: none; padding: 6px 0; color: var(--ink); font-size: inherit; text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; }
.ex { border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 4px; margin-bottom: 12px; }
.ex.card { padding-bottom: 16px; }
.exn { margin: 0; font-size: 1.06rem; font-weight: 600; line-height: 1.3; }
.ex .ziel { font-size: .84rem; color: var(--muted); margin-top: 2px; }
.ex.aktiv { border-color: var(--muted); }
.ex.fertig .exhead, .ex.fertig .extools { opacity: .55; }
.ex .jetzt { display: inline-block; font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--inv); background: var(--ink); border-radius: 6px; padding: 3px 7px; margin: -4px 0 10px; }
.exhead { display: flex; gap: 12px; align-items: center; }
.exinfo { min-width: 0; flex: 1; }
.exhead .exn { margin: 0; }
.ex .last { font-size: .8rem; color: var(--faint); margin-top: 3px; font-variant-numeric: tabular-nums; }
.pv { flex: 0 0 auto; width: 64px; height: 64px; padding: 0; border: 1px solid var(--line2); border-radius: 12px; overflow: hidden; background: var(--fill); display: flex; align-items: center; justify-content: center; color: var(--muted); }
.pv-leer { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
.pv-anim { position: relative; display: block; width: 100%; height: 100%; background: #141414; }
.pv-anim img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
.pv-anim img + img { animation: pvwechsel 2.4s steps(1, end) infinite; }
.pv-anim.kaputt { display: none; }
@keyframes pvwechsel { 0% { opacity: 0; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pv-anim img + img { animation: none; opacity: 0; } }
.extools { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 6px; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 10px; background: transparent; color: var(--ink); font-size: .84rem; }
.tbtn:active, .vidbtn:active { background: var(--fill2); }
.ueb-bild { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 4 / 3; background: var(--fill); display: flex; align-items: center; justify-content: center; color: var(--muted); }
.ueb-bild .pv-anim img { object-fit: cover; }
.ueb-fakten { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 14px; }
.ueb-fakten > div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.ueb-fakten b { display: block; margin-top: 4px; font-weight: 600; font-size: .92rem; }
.chip.on { color: var(--ink); background: var(--fill2); border-color: var(--fill2); min-height: 32px; font-size: .82rem; cursor: default; }
.scan-cam { position: relative; border-radius: 18px; overflow: hidden; background: #000; height: min(56vh, 480px); }
.scan-cam[hidden] { display: none; }
.scan-cam video { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .25s; background: #000; }
.scan-cam.laeuft video { opacity: 1; }
.scan-load { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.scan-cam.laeuft .scan-load { display: none; }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.18); border-top-color: #fff; animation: drehen .8s linear infinite; display: inline-block; }
@keyframes drehen { to { transform: rotate(360deg); } }
.scan-linie { position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: #fff; opacity: 0; box-shadow: 0 0 12px rgba(255,255,255,.8); }
.scan-cam.laeuft .scan-linie { opacity: .85; animation: linie 1.8s ease-in-out infinite alternate; }
@keyframes linie { from { top: 12%; } to { top: 86%; } }
.scan-cam.ok .scan-rahmen { border-color: #fff; border-width: 3px; }
.scan-cam.ok .scan-linie { animation: none; opacity: 0; }
.scan-licht { position: absolute; right: 12px; bottom: 12px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.45); color: #fff; display: flex; align-items: center; justify-content: center; }
.scan-licht[aria-pressed="true"] { background: #fff; color: #000; }
.scan-licht[hidden] { display: none; }
.prod-laden { display: flex; align-items: center; gap: 12px; color: var(--muted); padding: 18px 0; }
@media (prefers-reduced-motion: reduce) { .scan-cam.laeuft .scan-linie, .spin { animation: none; } }
.scan-rahmen { position: absolute; left: 10%; right: 10%; top: 28%; bottom: 28%; border: 2px solid rgba(255,255,255,.9); border-radius: 14px; box-shadow: 0 0 0 999px rgba(0,0,0,.4); overflow: hidden; transition: border-width .15s; }
.scan-hand { display: flex; gap: 8px; margin-top: 10px; }
.scan-hand input { flex: 1; min-width: 0; min-height: 48px; border-radius: var(--rs); border: 1px solid var(--line2); background: var(--fill); color: var(--ink); padding: 0 12px; font: inherit; }
.scan-alt-liste { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.scan-alt { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); text-align: left; }
.scan-alt img, .scan-alt .ph { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--fill2); flex: 0 0 auto; }
.scan-alt > span { display: flex; flex-direction: column; min-width: 0; }
.prod-kopf { display: flex; gap: 14px; align-items: center; }
.prod-kopf img { width: 76px; height: 76px; object-fit: contain; border-radius: 12px; background: #fff; flex: 0 0 auto; }
.prod-kopf h3 { margin: 0 0 4px; }
.faint { color: var(--faint); }
.urteil ul { margin: 6px 0 0; padding-left: 18px; }
.urteil.gut { border-color: var(--ink); }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-top: 12px; }
.score { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.score .scn { font-size: 1.6rem; font-weight: 600; line-height: 1.1; }
.naehr { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: .92rem; }
.naehr td { padding: 8px 0; border-top: 1px solid var(--hair); }
.naehr td + td { text-align: right; font-variant-numeric: tabular-nums; }
.konzern-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.konzern-links .tbtn { text-decoration: none; }
ol.schritte { margin: 8px 0 0; padding-left: 22px; }
ol.schritte li { margin: 0 0 8px; line-height: 1.45; }
.vidbtn { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; color: var(--ink); text-decoration: none; }
.sethead, .set { display: grid; grid-template-columns: 44px minmax(0, 1fr) 48px; align-items: center; column-gap: 8px; }
.ex.kg .sethead, .ex.kg .set { grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr) 48px; }
.sethead { font-size: .74rem; color: var(--faint); padding: 12px 0 6px; border-bottom: 1px solid var(--line); }
.sethead span:last-child { text-align: right; }
.set { min-height: 58px; border-bottom: 1px solid var(--hair); }
.set:last-of-type { border-bottom: 0; }
.set .nr { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.fld { display: flex; align-items: baseline; gap: 4px; min-width: 0; }
.fld input { width: 3.4em; min-height: 44px; border: 1px solid transparent; border-radius: 8px; background: transparent; padding: 0 6px; margin-left: -7px;
  font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.fld input:focus { background: var(--fill); border-color: var(--line2); }
.fld span { color: var(--faint); font-size: .76rem; }
.set.done .fld input, .set.done .nr { color: var(--faint); }
.sc { width: 44px; height: 44px; justify-self: end; border-radius: var(--rs); border: 1.5px solid #444; background: transparent;
  display: flex; align-items: center; justify-content: center; padding: 0; color: transparent; transition: background .12s, border-color .12s; }
.sc[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--inv); }
details.how { margin: 4px 0 8px; }
details.how summary { color: var(--muted); min-height: 40px; display: flex; align-items: center; font-size: .86rem; cursor: pointer; list-style: none; }
details.how summary::before { content: "+"; width: 16px; color: var(--faint); }
details.how[open] summary::before { content: "−"; }
details.how summary::-webkit-details-marker { display: none; }
details.how p { margin: 0 0 8px; font-size: .9rem; }
.edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
label.field.check { display: flex; align-items: center; gap: 12px; grid-column: 1 / -1; min-height: 48px; margin: 0 0 10px; }
label.field.check input { width: 22px; height: 22px; min-height: 0; margin: 0; flex: 0 0 auto; accent-color: #FAFAFA; }
label.field.check span { display: inline; margin: 0; color: var(--ink); font-size: .95rem; }
.actions { margin-top: 18px; display: grid; gap: 10px; }

/* Streak */
.streak { padding: 14px 16px; }
.sk-top { display: flex; align-items: center; gap: 12px; }
.sk-flamme { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; color: var(--faint); flex: 0 0 auto; }
.sk-flamme.an { color: var(--ink); }
.streak.heute .sk-flamme { background: var(--ink); border-color: var(--ink); color: var(--inv); }
.sk-zahl { flex: 1 1 auto; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.sk-zahl b { font-size: 2rem; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
.sk-zahl span { font-size: .82rem; color: var(--muted); }
.sk-frz { display: flex; gap: 6px; }
.sk-frz i { width: 32px; height: 32px; border-radius: 8px; border: 1px dashed var(--line2); display: flex; align-items: center; justify-content: center; color: #555; }
.sk-frz i.an { border: 1px solid var(--ink); color: var(--ink); }
.sk-woche { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
.sk-tag { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: .68rem; color: var(--faint); }
.sk-tag i { width: 100%; max-width: 34px; aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink); }
.sk-tag i svg { width: 14px; height: 14px; }
.sk-tag.ok i { background: var(--ink); border-color: var(--ink); }
.sk-tag.freeze i { border: 1px solid var(--ink); }
.sk-tag.weg i { border-style: dashed; border-color: #5A5A5A; background: repeating-linear-gradient(135deg, transparent 0 5px, #2A2A2A 5px 6px); }
.sk-tag.offen i { border: 1.5px solid var(--muted); }
.sk-tag.offen span { color: var(--ink); font-weight: 600; }
.sk-unten { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: .78rem; color: var(--muted); }
.sk-unten span:first-child { color: var(--ink); }

/* Pausentimer, schwebt frei über der Navigation */
#timerbar { position: fixed; left: 12px; right: 12px; bottom: calc(var(--tab-h) + var(--safe-b) + 10px); z-index: 25;
  max-width: 696px; margin: 0 auto; display: flex; align-items: center; gap: 6px;
  background: var(--ink); color: var(--inv); border-radius: 18px; padding: 8px 8px 8px 18px; box-shadow: 0 12px 32px rgba(0,0,0,.6); }
#timerbar[hidden] { display: none; }
#timerbar .info { flex: 1 1 auto; min-width: 0; }
#timerbar .clock { font-size: 1.6rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
#timerbar .lbl { font-size: .72rem; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#timerbar .adj { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 12px; border: 0; background: #E4E4E4; color: var(--inv);
  font-weight: 600; font-size: .85rem; display: flex; align-items: center; justify-content: center; padding: 0; }
#timerbar .go { width: 48px; height: 48px; flex: 0 0 auto; border-radius: 12px; border: 0; background: var(--inv); color: var(--ink);
  display: flex; align-items: center; justify-content: center; padding: 0; }
#timerbar.alarm { animation: flash .5s 6; }
@keyframes flash { 50% { background: #9A9A9A; } }
body.with-timer { padding-bottom: calc(var(--tab-h) + var(--safe-b) + var(--pill-h) + 34px); }

/* Produkte und Rezepte */
.item { display: grid; grid-template-columns: 80px 1fr; gap: 14px; }
.thumb { width: 80px; height: 80px; border-radius: var(--rs); background: #fff; object-fit: contain; padding: 4px; }
.nobg { background: var(--fill); }
.kv { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: .86rem; }
.tag { display: inline-block; font-size: .74rem; font-weight: 500; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line2); color: var(--muted); }
.tag.good { background: var(--ink); border-color: var(--ink); color: var(--inv); font-weight: 600; }
.tag.both { color: var(--ink); }
.tag.sale { color: var(--ink); border-color: var(--ink); }
.miss { color: var(--muted); font-size: .88rem; }
.miss b, .have b { color: var(--ink); font-weight: 600; }
.have { font-size: .88rem; color: var(--muted); }
.rcard { padding: 0; overflow: hidden; }
.rcard .hero { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--fill); border-bottom: 1px solid var(--line); }
.rcard .hero.none { display: flex; align-items: center; justify-content: center; color: var(--faint); aspect-ratio: 16 / 5; font-size: .85rem; }
.rcard .body { padding: 14px 16px 16px; }
.rcard h3 { font-size: 1.08rem; }
.rcard .lines { display: grid; gap: 4px; margin-top: 10px; }
.mealh { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stack { display: flex; flex: 0 0 auto; flex-direction: row-reverse; }
.stack img { width: 60px; height: 60px; border-radius: var(--rs); background: #fff; object-fit: contain; padding: 4px;
  box-shadow: 0 0 0 3px var(--bg); margin-left: -14px; }
.stack img:last-child { margin-left: 0; }
.credit { font-size: .72rem; color: var(--faint); }
.btn.star { font-size: 1.1rem; min-width: 44px; padding: 0 12px; }
.meal table { width: 100%; border-collapse: collapse; font-size: .9rem; margin-top: 10px; }
.meal td { padding: 8px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.meal td:first-child { padding-left: 0; } .meal td:last-child { padding-right: 0; }
.meal td.r { text-align: right; white-space: nowrap; }
.meal tr.sum td { font-weight: 600; }
.meal tr.head td { border-top: 0; color: var(--faint); font-size: .74rem; }
.meal td a { text-decoration: none; font-weight: 500; }

/* Vorrat */
.vin { position: relative; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sugg:empty { display: none; }
.picked { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.picked .chip { color: var(--ink); background: var(--fill2); border-color: var(--fill2); }
.cat { border-top: 1px solid var(--line); }
.cat:first-of-type { border-top: 0; }
.cat summary { min-height: 48px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; list-style: none; font-weight: 500; }
.cat summary::-webkit-details-marker { display: none; }
.cat summary::after { content: "+"; color: var(--faint); font-size: 1.1rem; }
.cat[open] summary::after { content: "−"; }
.cat .chips { flex-wrap: wrap; padding-bottom: 14px; }
.hint { font-size: .8rem; color: var(--faint); margin-top: 10px; }
.chips.ideen { margin: 10px -16px 0; padding: 0 16px 2px; }
details.filt > summary { min-height: 44px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; list-style: none; line-height: 1.35; }
details.filt > summary::-webkit-details-marker { display: none; }
details.filt > summary::after { content: "+"; color: var(--faint); font-size: 1.1rem; }
details.filt[open] > summary::after { content: "−"; }

/* Navigation */
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--tab-h) + var(--safe-b)); padding: 0 8px var(--safe-b); background: var(--bg); border-top: 1px solid var(--line); }
nav.tabs button { border: 0; background: transparent; color: var(--faint); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px; font-size: .7rem; font-weight: 500; }
nav.tabs button svg { width: 22px; height: 22px; padding: 4px 16px; box-sizing: content-box; border-radius: 16px; transition: background-color .25s ease, color .2s ease, transform .2s ease; }
nav.tabs button { transition: color .2s ease; -webkit-tap-highlight-color: transparent; }
nav.tabs button[aria-selected="true"] svg { background: var(--fill2); }
nav.tabs button:active svg { transform: scale(.92); }
nav.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; }
.seg.drei button { font-size: .88rem; padding: 0 4px; }
.scan-status { margin: 10px 2px 0; font-size: .9rem; color: var(--muted); min-height: 1.3em; }
.scan-info { margin-top: 12px; }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.7); display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }
.sheet .panel { width: 100%; max-width: 720px; max-height: 88vh; background: #121212; border: 1px solid var(--line); border-bottom: 0;
  border-radius: 18px 18px 0 0; display: flex; flex-direction: column; padding-bottom: var(--safe-b); }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px 20px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1; margin: 0; font-size: 1.15rem; font-weight: 600; }
.sheet-body { overflow-y: auto; padding: 12px 20px 24px; }
.sheet-body .card { background: transparent; }
.li { display: flex; align-items: center; gap: 12px; min-height: 58px; border-bottom: 1px solid var(--hair); }
.chk { width: 44px; height: 44px; flex: 0 0 auto; border-radius: var(--rs); border: 1.5px solid #444; background: transparent; font-weight: 700; }
.chk[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--inv); }
.chk[aria-pressed="true"]::before { content: "✓"; }
.li.done .t { text-decoration: line-through; color: var(--faint); }
.li .t { flex: 1; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin: 8px 0; }
.bars i { flex: 1; background: var(--ink); border-radius: 3px 3px 0 0; min-height: 2px; }

/* Stundenplan */
.plan-now .big { font-size: 1.15rem; font-weight: 600; margin: 6px 0 6px; line-height: 1.3; }
.plan-now b { color: var(--ink); font-weight: 600; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 46px 22px 1fr auto; gap: 8px; align-items: center; padding: 9px 0; border-top: 1px solid var(--hair); }
.tl .ico { color: var(--faint); display: flex; }
.tl li.k-training .ico { color: var(--ink); }
.tl .tx { line-height: 1.35; }
.tl-ab { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 14px 0 2px; }
.tl-ab:first-of-type { margin-top: 10px; }
.tl-k { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line2); background: transparent; color: var(--ink); font-size: 1rem; display: flex; align-items: center; justify-content: center; padding: 0; }
.tl-k.hak.on { background: var(--ink); color: var(--inv); border-color: var(--ink); font-weight: 700; }
.tl li.now .tl-k { border-color: var(--inv); color: var(--inv); }
.tl li.now .tl-k.hak.on { background: var(--inv); color: var(--ink); }
.tl li.now .ico { color: var(--inv); }
.nowrow { display: flex; gap: 12px; align-items: center; margin: 8px 0 4px; }
.nowrow .big { margin: 0; }
.nico { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 12px; background: var(--ink); color: var(--inv); display: flex; align-items: center; justify-content: center; }
.nbar, .gew-bar { height: 4px; border-radius: 4px; background: var(--fill2); overflow: hidden; margin: 10px 0 8px; }
.nbar i, .gew-bar i { display: block; height: 100%; background: var(--ink); border-radius: 4px; }
.nnext { display: flex; flex-direction: column; gap: 2px; font-size: .86rem; }
.nnext b { font-weight: 600; }
.nacts { display: flex; gap: 8px; margin-top: 12px; }
.nacts .btn { flex: 1; }
.gew-kopf { display: flex; justify-content: space-between; align-items: baseline; }
.gew-liste { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.gew-item { display: flex; align-items: center; gap: 10px; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); padding: 0 12px; text-align: left; font-size: .92rem; }
.gew-item .box { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line2); display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700; }
.gew-item.on { color: var(--muted); }
.gew-item.on .box { background: var(--ink); border-color: var(--ink); color: var(--inv); }
.tl li:first-child { border-top: 0; }
.tl .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .88rem; padding-top: 1px; }
.tl li.past { opacity: .4; }
.tl li.now { background: var(--ink); color: var(--inv); border-radius: var(--rs); margin: 0 -10px; padding: 10px; border-top-color: transparent; }
.tl li.now + li { border-top-color: transparent; }
.tl li.now .t { color: var(--inv); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .76rem; color: var(--faint); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; background: var(--line2); }
.legend i.k-training { background: var(--ink); }
.wk { overflow: hidden; margin: 4px -4px -4px; }
.wk table { border-collapse: separate; border-spacing: 4px; font-size: .78rem; table-layout: fixed; width: 100%; }
.wk thead th { font-weight: 500; color: var(--faint); padding: 2px 1px 4px; text-align: center; font-size: .7rem; }
.wk thead th:first-child { width: 28%; }
.wk th.tg { text-align: center; padding: 7px 2px; border-radius: 8px; background: var(--fill); overflow: hidden; }
.wk th.tg b { display: block; font-size: .86rem; line-height: 1.2; font-weight: 600; }
.wk th.tg span { display: block; font-size: .68rem; font-weight: 400; line-height: 1.25; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wk td { text-align: center; padding: 8px 1px; border-radius: 8px; background: var(--fill); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wk td.today, .wk th.today { background: var(--ink); color: var(--inv); }
.wk th.today span { color: #444; }
.cheat ol { margin: 8px 0 0; padding-left: 20px; }
.cheat li { margin: 6px 0; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + var(--safe-b) + 16px); z-index: 60;
  background: var(--ink); color: var(--inv); padding: 12px 18px; border-radius: 12px; font-weight: 600; max-width: 90vw;
  opacity: 0; pointer-events: none; transform: translate(-50%, 10px) scale(.98); transition: opacity .22s ease, transform .28s cubic-bezier(.2,.8,.2,1); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
#toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
body.with-timer #toast { bottom: calc(var(--tab-h) + var(--safe-b) + var(--pill-h) + 24px); }

/* ======================================================= Bewegung
   Kurz, ruhig, mit Zweck: Eintritt beim Tab Wechsel, Blätter von unten, Druck Feedback, Haken, Fortschritt.
   Wer im System weniger Bewegung eingestellt hat, bekommt keine. */
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
@keyframes rein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes blattHoch { from { transform: translateY(100%); } to { transform: none; } }
@keyframes blattRunter { from { transform: none; } to { transform: translateY(100%); } }
@keyframes einblenden { from { opacity: 0; } to { opacity: 1; } }
@keyframes ausblenden { from { opacity: 1; } to { opacity: 0; } }
@keyframes hak { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
@keyframes druck { 0% { transform: scale(1); } 40% { transform: scale(.94); } 100% { transform: scale(1); } }
#main.eintritt > * { animation: rein .34s cubic-bezier(.2,.8,.2,1) both; }
#main.eintritt > *:nth-child(2) { animation-delay: .03s; }
#main.eintritt > *:nth-child(3) { animation-delay: .06s; }
#main.eintritt > *:nth-child(4) { animation-delay: .09s; }
#main.eintritt > *:nth-child(5) { animation-delay: .12s; }
#main.eintritt > *:nth-child(n+6) { animation-delay: .15s; }
.sheet:not([hidden]) { animation: einblenden .22s ease both; }
.sheet:not([hidden]) .panel { animation: blattHoch .34s cubic-bezier(.2,.85,.25,1) both; }
.sheet.zu { animation: ausblenden .2s ease both; }
.sheet.zu .panel { animation: blattRunter .22s cubic-bezier(.4,0,1,1) both; }
#timerbar:not([hidden]) { animation: rein .3s cubic-bezier(.2,.8,.2,1) both; }
.btn, .chip, .tbtn, .gew-item, .scan-alt, .seg button, .iconbtn, .sc, .tl-k, .pv, .scanbtn { transition: transform .12s ease, background-color .18s ease, border-color .18s ease, color .18s ease; }
.btn:active, .chip:active, .tbtn:active, .gew-item:active, .scan-alt:active, .iconbtn:active, .tl-k:active, .pv:active { transform: scale(.97); }
.sc:active { transform: scale(.92); }
.sc.pop svg, .gew-item.pop .box svg, .tl-k.pop svg { animation: hak .34s cubic-bezier(.3,1.5,.5,1) both; }
.sc.pop { animation: druck .3s ease; }
.set { transition: background-color .25s ease; }
.nbar i, .gew-bar i { transition: width .6s cubic-bezier(.2,.8,.2,1); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>

<script>
'use strict';

/* ======================================================= Hilfen */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KA = 'keine Angabe';
const n1 = v => (v == null || isNaN(v)) ? KA : String(Math.round(v * 10) / 10);
const n0 = v => (v == null || isNaN(v)) ? KA : String(Math.round(v));
const chf = v => (v == null || isNaN(v)) ? KA : 'CHF ' + Number(v).toFixed(2);
const clone = o => JSON.parse(JSON.stringify(o));
const datum = iso => { try { const d = new Date(iso); return d.toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit', year: 'numeric' }); } catch (e) { return iso; } };
const datumZeit = iso => { try { const d = new Date(iso); return d.toLocaleString('de-CH', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return iso; } };

const LS = {
  get(k, d) { try { const v = localStorage.getItem('fit.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fit.' + k, JSON.stringify(v)); return true; } catch (e) { toast('Speichern fehlgeschlagen. Speicher voll oder gesperrt.'); return false; } },
  del(k) { try { localStorage.removeItem('fit.' + k); } catch (e) {} },
  keys() { try { return Object.keys(localStorage).filter(k => k.indexOf('fit.') === 0); } catch (e) { return []; } }
};

const IDB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('fitapp', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  async get(k) {
    const db = this.db || await this.open(); if (!db) return null;
    return new Promise(res => { try { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result == null ? null : q.result); q.onerror = () => res(null); } catch (e) { res(null); } });
  },
  async set(k, v) {
    const db = this.db || await this.open(); if (!db) return false;
    return new Promise(res => { try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); } });
  }
};

let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ======================================================= Daten */

}

    popcorn: { n: 'Coop Salted Popcorn', pack: '100 g', p: 0.95, u: 'https://www.coop.ch/en/food/sweets-snacks/crisps-snacks/crisps-popcorn/popcorn/salted-popcorn/p/4070561', k: 471, pr: 8, z: 0, f: 21 },

};

/* Alte gespeicherte Pläne (ohne Version) auf den neuen Stand bringen, eigene Änderungen bleiben */
function migratePlan(p) {
  if (!p || !Array.isArray(p.days) || !p.days.length) return clone(DEFAULT_PLAN);
  if ((p.v || 1) >= PLAN_V) return p;
  DEFAULT_PLAN.days.forEach((dd, di) => {
    const d = p.days.find(x => x.id === dd.id);
    if (!d) { p.days.splice(Math.min(di, p.days.length), 0, clone(dd)); return; }
    d.wds = dd.wds.slice(); delete d.wd;
    d.ex.forEach(ex => {
      const de = dd.ex.find(x => x.id === ex.id);
      if (ex.kg == null) ex.kg = de ? !!de.kg : false;
      if (ex.soll == null && de) ex.soll = de.soll;
      if (ex.kgSoll == null && de && de.kgSoll) ex.kgSoll = de.kgSoll;
    });
  });
  p.days.forEach(d => { if (!d.wds) { d.wds = d.wd != null ? [d.wd] : []; delete d.wd; } d.ex.forEach(ex => { if (ex.kg == null) ex.kg = false; }); });
  /* Version 3: Tag A war zu lang für 32 Minuten, wird durch die neue Fassung ersetzt */
  if ((p.v || 1) < 3) { const i = p.days.findIndex(x => x.id === 'A'); if (i >= 0) p.days[i] = clone(DEFAULT_PLAN.days.find(x => x.id === 'A')); }
  /* Version 5: Aufwärmen und Nacken in jedem Training, Joggen wird Beweglichkeit, Videos zu jeder Übung */
  /* Version 6: Bilder, Muskeln, Nacken in zwei Übungen */

  if (isToday) d.items.forEach((it, i) => { let m = toMin(it[0]); if (m != null && m < start) m += 1440; if (m != null && m <= nowMin) cur = i; });

    const blockPct = (c && next && mins[cur + 1] > von) ? Math.min(100, Math.round((nm - von) / (mins[cur + 1] - von) * 100)) : 0;

    }
  } else {

  }
  h += streakKarte(false);
  /* Tagesablauf in Abschnitten */
  const abschnitt = m => m == null ? 'Tag' : (m < 9 * 60 ? 'Morgen' : m < 17 * 60 ? 'Tag' : 'Abend');
  const tagStart = mins[0], tagEnde = mins[mins.length - 1];
  const tagPct = isToday ? Math.max(0, Math.min(100, Math.round((nm - tagStart) / (tagEnde - tagStart) * 100))) : 0;
  h += `<div class="card tlcard">${isToday ? `<div class="gew-kopf"><span class="lab">Dein Tag</span><span class="small muted">${tagPct} % vorbei</span></div><div class="gew-bar"><i style="width:${tagPct}%"></i></div>` : ''}`;
  let letzter = '';
  d.items.forEach((it, i) => {

  });
  h += '</ul></div>';

  h += '<div class="card"><h3>Die Woche</h3><div class="wk"><table><thead><tr><th>Tag</th>' +
    WOCHE_SPALTEN.map(c => `<th>${c[0]}</th>`).join('') + '</tr></thead><tbody>';

    </ol></div>`;
  $('#main').innerHTML = h;
}

/* ======================================================= Modul 1: Training */
function heuteHinweis(day) {

  if (wd === 0 && PFLICHT.indexOf(day.id) >= 0) return 'Verpasst, heute nachholen';
  return 'Heute laut Stundenplan';
}
function renderTraining() {
  const day = dayById(curDay);
  const s = sessionFor(day);
  const total = day.ex.reduce((a, ex) => a + ex.sets, 0);
  const done = day.ex.reduce((a, ex) => a + s.sets[ex.id].filter(x => x.d).length, 0);
  let h = '<div class="chips" role="tablist">' + plan.days.map(d =>
    `<button class="chip" data-day="${esc(d.id)}" aria-pressed="${d.id === day.id}">${esc(d.name)}</button>`).join('') + '</div>';
  const pct = total ? Math.round(done / total * 100) : 0;
  if (!editMode) h += streakKarte(true);
  h += `<div class="card daycard"><div class="ring" style="--p:${pct}" role="img" aria-label="${done} von ${total} Sätzen erledigt"><span>${done}/${total}</span></div>

  const aktivIdx = done ? day.ex.findIndex(x => s.sets[x.id].some(st => !st.d)) : 0;
  day.ex.forEach((ex, xi) => {
    const sets = s.sets[ex.id];
    h += `<section class="ex ${editMode ? 'card' : (ex.kg ? 'kg' : '')} ${!editMode && xi === aktivIdx ? 'aktiv' : ''} ${!editMode && sets.every(x => x.d) ? 'fertig' : ''}" data-ex="${esc(ex.id)}">`;
    if (editMode) {
      h += `<label class="field"><span>Name</span><input type="text" data-edit="name" value="${esc(ex.name)}"></label>
        <div class="edit-grid">
          <label class="field"><span>Sätze</span><input inputmode="numeric" data-edit="sets" value="${ex.sets}"></label>
          <label class="field"><span>Pause in Sekunden</span><input inputmode="numeric" data-edit="pause" value="${ex.pause}"></label>
          <label class="field"><span>Ziel</span><input type="text" data-edit="ziel" value="${esc(ex.ziel)}"></label>
          <label class="field"><span>Einheit</span><select data-edit="einheit">
            ${['Wdh', 'Sek', 'Min'].map(u => `<option ${ex.einheit === u ? 'selected' : ''}>${u}</option>`).join('')}</select></label>
          <label class="field"><span>Soll pro Satz</span><input inputmode="numeric" data-edit="soll" value="${esc(ex.soll != null ? ex.soll : '')}"></label>
          <label class="field check"><input type="checkbox" data-edit="kg" ${ex.kg ? 'checked' : ''}><span>Mit Gewicht (kg Feld)</span></label>
        </div>
        <button class="btn danger sm" data-act="delex">Übung löschen</button>`;
    } else {
      const lm = letztesMal(ex);
      const offen = sets.some(x => !x.d);
      const halten = (ex.einheit === 'Sek' || ex.einheit === 'Min') && ex.soll;
      h += `${xi === aktivIdx ? '<div class="jetzt">Jetzt dran</div>' : ''}
        <div class="exhead">
          <button class="pv" data-act="detail" aria-label="Anleitung für ${esc(ex.name)}">${bildHtml(ex)}</button>
          <div class="exinfo"><h3 class="exn">${esc(ex.name)}</h3>
            <div class="ziel">${ex.sets} × ${esc(ex.ziel || KA)}${ex.pause ? ' · Pause ' + ex.pause + ' s' : ''}</div>
            ${lm ? `<div class="last">Letztes Mal: ${esc(lm)}</div>` : ''}</div>
        </div>
        <div class="extools">
          ${halten && offen ? `<button class="tbtn" data-act="halten"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>${ex.einheit === 'Min' ? ex.soll + ' Min' : ex.soll + ' s'} Timer</button>` : ''}
          <button class="tbtn" data-act="detail"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>Anleitung</button>
        </div>
        <div class="sethead"><span>Satz</span>${ex.kg ? '<span>kg</span>' : ''}<span>${ex.einheit === 'Wdh' ? 'Wiederholungen' : ex.einheit === 'Sek' ? 'Sekunden' : 'Minuten'}</span><span>Fertig</span></div>`;
      sets.forEach((st, i) => {
        h += `<div class="set ${ex.kg ? '' : 'nokg'} ${st.d ? 'done' : ''}">
          <span class="nr">${i + 1}</span>
          ${ex.kg ? `<label class="fld"><input inputmode="decimal" data-f="w" data-i="${i}" value="${esc(st.w)}" placeholder="0" aria-label="Gewicht Satz ${i + 1} in kg"></label>` : ''}
          <label class="fld"><input inputmode="numeric" data-f="r" data-i="${i}" value="${esc(st.r)}" placeholder="0" aria-label="${esc(ex.einheit)} Satz ${i + 1}"></label>
          <button class="sc" data-act="toggle" data-i="${i}" aria-pressed="${st.d}" aria-label="Satz ${i + 1} ${st.d ? 'erledigt' : 'abhaken'}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>

  });
  if (editMode) {
    h += `<div class="actions"><button class="btn wide" data-act="addex">Übung hinzufügen</button>

  if (ring) { const alt = renderTraining.p; if (alt != null && alt !== pct && renderTraining.tag === day.id) { ring.style.setProperty('--p', alt); requestAnimationFrame(() => requestAnimationFrame(() => ring.style.setProperty('--p', pct))); } renderTraining.p = pct; renderTraining.tag = day.id; }
}

$('#main').addEventListener('click', e => {
  if (tab !== 'training') return;
  const dayBtn = e.target.closest('[data-day]');
  if (dayBtn) { curDay = dayBtn.dataset.day; renderTraining(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const day = dayById(curDay);
  const exEl = b.closest('[data-ex]');
  const ex = exEl ? day.ex.find(x => x.id === exEl.dataset.ex) : null;
  const act = b.dataset.act;
  if (act === 'toggle' && ex) {
    unlockAudio();
    const s = sessionFor(day); const st = s.sets[ex.id][+b.dataset.i];
    st.d = !st.d; saveSessions();
    if (st.d && ex.pause > 0) Timer.start(ex.pause, ex.name + ', Satz ' + (+b.dataset.i + 1));
    if (st.d) requestWake();
    renderTraining();
    if (st.d) { const nb = $(`[data-ex="${ex.id}"] [data-act="toggle"][data-i="${b.dataset.i}"]`); if (nb) nb.classList.add('pop'); }
  } else if (act === 'detail' && ex) openUebung(ex);
  else if (act === 'halten' && ex) {
    unlockAudio(); requestWake();
    Timer.start(ex.einheit === 'Min' ? ex.soll * 60 : ex.soll, (ex.einheit === 'Min' ? '' : 'Halten: ') + ex.name);
  } else if (act === 'finish') finishTraining();
  else if (act === 'history') openHistory();
  else if (act === 'edit') { editMode = true; renderTraining(); }
  else if (act === 'editdone') { editMode = false; savePlan(); renderTraining(); toast('Plan gespeichert'); }
  else if (act === 'addex') {
    day.ex.push({ id: 'x' + Date.now().toString(36), name: 'Neue Übung', sets: 3, ziel: '', pause: 60, einheit: 'Wdh', soll: 10, kg: false, how: '', easy: '' });
    savePlan(); renderTraining();
  } else if (act === 'delex' && ex) {
    if (b.dataset.sure) { day.ex = day.ex.filter(x => x !== ex); savePlan(); renderTraining(); toast('Übung gelöscht'); }
    else { b.dataset.sure = '1'; b.textContent = 'Wirklich löschen? Nochmals tippen'; }
  }
});

/* Bilder: Free Exercise DB (github.com/yuhonas/free-exercise-db), Public Domain. Zwei Fotos, Start und Ende, im Wechsel wie ein kurzes Video */
const BILD_BASE = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';
const ICON_HANTEL = '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 8v8M3.5 10v4M18 8v8M20.5 10v4M6 12h12"/></svg>';
function bildHtml(ex, gross) {
  if (!ex.bild) return `<span class="pv-leer">${ICON_HANTEL}</span>`;
  const u = BILD_BASE + encodeURIComponent(ex.bild) + '/';
  return `<span class="pv-anim ${gross ? 'gross' : ''}"><img src="${u}0.jpg" alt="" loading="lazy" decoding="async" onerror="this.closest('.pv-anim').classList.add('kaputt')"><img src="${u}1.jpg" alt="" loading="lazy" decoding="async"></span>`;
}
/* Werte vom letzten Mal, z. B. "10 · 9 · 8" oder "8 kg × 10 · 8 kg × 9" */
function letztesMal(ex) {
  if (ex.einheit === 'Min') return '';
  for (let i = history.length - 1; i >= 0; i--) {
    const e = (history[i].ex || []).find(x => x.id === ex.id);
    if (e && e.sets && e.sets.length) {
      const eh = ex.einheit === 'Sek' ? ' s' : '';
      const t = e.sets.map(st => (ex.kg && st.w ? st.w + ' kg × ' : '') + (st.r || '?') + eh).join(' · ');
      const d = new Date(history[i].date);
      return t + ' (' + d.getDate() + '.' + (d.getMonth() + 1) + '.)';
    }
  }
  return '';
}
/* Geschätzte Dauer: Satzzeit plus Pausen plus Wechsel zwischen den Übungen */
function dauerMin(day) {
  let t = 0;
  day.ex.forEach((x, i) => {
    const per = /pro (Bein|Seite)/.test(x.ziel || '') ? 2 : 1;
    const satz = x.einheit === 'Min' ? (x.soll || 1) * 60 : x.einheit === 'Sek' ? ((x.soll || 30) + 10) * per * (/2 Mal/.test(x.ziel || '') ? 2 : 1) : (/Zirkel/.test(x.name) ? 100 : 40 * per);
    t += x.sets * satz + (x.sets - 1) * (x.pause || 0) + (i ? 30 : 0);
  });
  return Math.max(1, Math.round(t / 60));
}
function openUebung(ex) {
  const schritte = (ex.how || '').split(/(?<=\.)\s+(?=[A-ZÄÖÜ0-9])/).map(x => x.trim()).filter(Boolean);
  const lm = letztesMal(ex);
  const body = `<div class="ueb">
    <div class="ueb-bild">${bildHtml(ex, true)}</div>
    ${ex.bildHinweis ? `<p class="muted small" style="margin:8px 0 0">${esc(ex.bildHinweis)}</p>` : ''}
    <div class="ueb-fakten">
      <div><span class="lab">Ziel</span><b>${ex.sets} × ${esc(ex.ziel || KA)}</b></div>
      ${ex.pause ? `<div><span class="lab">Pause</span><b>${ex.pause} s</b></div>` : ''}
      ${lm ? `<div><span class="lab">Letztes Mal</span><b>${esc(lm)}</b></div>` : ''}
    </div>
    ${ex.mus ? `<div class="lab" style="margin-top:14px">Trainiert</div><div class="chips" style="margin-top:6px">${ex.mus.split(',').map(m => `<span class="chip on">${esc(m.trim())}</span>`).join('')}</div>` : ''}
    ${schritte.length ? `<div class="lab" style="margin-top:14px">So geht's</div><ol class="schritte">${schritte.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}
    ${ex.easy ? `<div class="card" style="margin-top:12px"><div class="lab">Zu schwer?</div><p style="margin:6px 0 0">${esc(ex.easy)}</p></div>` : ''}
    ${ex.vid === '' ? '' : `<a class="btn wide vidbtn" href="${esc(videoLink(ex))}" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>Videos auf YouTube</a>`}
    ${ex.bild ? '<p class="muted small" style="margin-top:12px">Bilder: Free Exercise DB, gemeinfrei.</p>' : ''}
  </div>`;
  openSheet(ex.name, body);
}

/* Vorschau: YouTube Suche mit englischem Suchbegriff, eigene Übungen über ihren Namen */
function videoLink(ex) {
  const q = ex.vid || (ex.name + ' Übung richtig ausführen');
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
}

function finishTraining() {
  const day = dayById(curDay); const s = sessionFor(day);
  const ex = day.ex.map(x => ({ id: x.id, name: x.name, einheit: x.einheit,
    sets: s.sets[x.id].filter(st => st.d).map(st => ({ w: x.kg ? st.w : '', r: st.r })) })).filter(x => x.sets.length);
  if (!ex.length) { toast('Noch kein Satz abgehakt'); return; }
  const soll = day.ex.reduce((a, x) => a + x.sets, 0);
  const fertig = day.ex.reduce((a, x) => a + s.sets[x.id].filter(st => st.d).length, 0);
  const vorher = streakInfo();
  history.push({ id: Date.now().toString(36), date: new Date().toISOString(), start: s.start, dayId: day.id, dayName: day.name + ': ' + day.title, ex, voll: fertig >= soll, soll, fertig });
  if (!LS.set('history', history)) { history.pop(); return; }
  delete sessions[day.id]; saveSessions();
  Timer.reset(); releaseWake();
  renderTraining();
  const nachher = streakInfo();
  streakAnsWidget();
  if (nachher.heute && !vorher.heute) toast(`Streak ${nachher.streak} ${nachher.streak === 1 ? 'Tag' : 'Tage'}${nachher.freezes > vorher.freezes ? '. Neuer Freeze verdient' : ''}. Gut gemacht.`);
  else if (fertig < soll) toast(`Gespeichert. Für die Streak fehlen ${soll - fertig} ${soll - fertig === 1 ? 'Satz' : 'Sätze'}.`);
  else if (!zaehltFuer(history[history.length - 1])) toast('Gespeichert. Für die Streak zählt heute ' + dayById(planDayId()).name + ' oder ein Pflichttag.');
  else toast('Training gespeichert. Gut gemacht.');
}

/* ======================================================= Streak */
/* Regeln: jeder Tag braucht das Training, das der Plan für diesen Tag vorsieht (oder einen Pflichttag A, B, C),
   und zwar mit allen Sätzen abgehakt. Alle 2 geschaffte Tage gibt es 1 Freeze, höchstens 2 auf Vorrat,
   höchstens 1 pro Tag. Ein verpasster Tag frisst automatisch einen Freeze, ohne Freeze ist die Streak weg. */
const FREEZE_MAX = 2, FREEZE_ALLE = 2;
function tagKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function keyDatum(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); }
function planIdFuer(datum) { const wd = datum.getDay(); const d = plan.days.find(x => (x.wds || []).indexOf(wd) >= 0); return d ? d.id : null; }
function zaehltFuer(h) {
  if (h.voll === false) return false;
  const datum = new Date(h.date);
  return PFLICHT.indexOf(h.dayId) >= 0 || h.dayId === planIdFuer(datum);
}
function streakInfo() {
  const gut = new Set(history.filter(zaehltFuer).map(h => tagKey(new Date(h.date))));
  const heute = tagKey(new Date());
  const res = { streak: 0, best: 0, freezes: 0, fortschritt: 0, heute: gut.has(heute), letzter: '', tage: {}, eingesetzt: [] };
  if (!gut.size) return res;
  const start = Array.from(gut).sort()[0];
  let anzahl = 0;
  for (let d = keyDatum(start); tagKey(d) <= heute; d.setDate(d.getDate() + 1)) {
    const k = tagKey(d);
    if (gut.has(k)) {
      res.streak++; anzahl++; res.letzter = k; res.tage[k] = 'ok';
      if (anzahl % FREEZE_ALLE === 0 && res.freezes < FREEZE_MAX) res.freezes++;
    } else if (k === heute) {
      res.tage[k] = 'offen';
    } else if (res.streak > 0 && res.freezes > 0) {
      res.freezes--; res.tage[k] = 'freeze'; res.eingesetzt.push(k);
    } else {
      if (res.streak > 0) res.tage[k] = 'weg'; else res.tage[k] = 'leer';
      res.streak = 0;
    }
    res.best = Math.max(res.best, res.streak);
  }
  res.fortschritt = res.freezes >= FREEZE_MAX ? FREEZE_ALLE : anzahl % FREEZE_ALLE;
  return res;
}

const ICON_FREEZE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5"/></svg>';
function streakKarte(kompakt) {
  const s = streakInfo();
  const tage = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); tage.push(d); }
  const KZ = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const zust = { ok: 'Geschafft', freeze: 'Freeze eingesetzt', weg: 'Verpasst', leer: 'Kein Training', offen: 'Heute offen' };
  const heutePlan = dayById(planDayId());
  const status = s.heute ? 'Heute geschafft' : (s.streak ? `Heute noch: ${esc(heutePlan.name)}` : `Start heute: ${esc(heutePlan.name)}`);
  const naechster = s.freezes >= FREEZE_MAX ? 'Freezes voll' : `${FREEZE_ALLE - s.fortschritt} ${FREEZE_ALLE - s.fortschritt === 1 ? 'Tag' : 'Tage'} bis zum nächsten Freeze`;
  return `<div class="card streak ${s.heute ? 'heute' : ''}">
    <div class="sk-top">

      <div class="sk-frz" role="img" aria-label="${s.freezes} von ${FREEZE_MAX} Freezes">${Array.from({ length: FREEZE_MAX }, (_, i) => `<i class="${i < s.freezes ? 'an' : ''}">${ICON_FREEZE}</i>`).join('')}</div>
    </div>
    ${kompakt ? '' : `<div class="sk-woche">${tage.map(d => { const k = tagKey(d); const z = s.tage[k] || (k === tagKey(new Date()) ? 'offen' : 'leer');
      return `<div class="sk-tag ${z}" title="${zust[z]}"><span>${KZ[d.getDay()]}</span><i>${z === 'freeze' ? ICON_FREEZE : ''}</i></div>`; }).join('')}</div>`}
    <div class="sk-unten"><span>${status}</span><span>${naechster}${s.best > s.streak ? ` · Rekord ${s.best}` : ''}</span></div>

}

const WIDGET_PLAN_EN = { A: 'Chest & shoulders', B: 'Legs & back', C: 'Full body', J: 'Mobility', L: 'Walk' };
function streakAnsWidget() {
  try {
    if (!NATIVE || typeof NATIVE.setStreak !== 'function') return;
    const s = streakInfo();
    NATIVE.setStreak(s.streak, s.freezes, s.best, s.letzter || '', tagKey(new Date()));
    if (typeof NATIVE.setStreakTage === 'function') {
      const code = { ok: 'o', freeze: 'f', weg: 'm', leer: 'm' };
      const teile = [];
      for (let i = 7; i >= 1; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const k = tagKey(d), z = code[s.tage[k]];
        if (z) teile.push(k + ':' + z);

function streakMeldung() {

function openHistory() {
  const names = Array.from(new Set(history.flatMap(h => h.ex.map(e => e.name)).concat(plan.days.flatMap(d => d.ex.map(e => e.name)))));
  let sel = LS.get('histEx', names[0] || '');
  if (names.indexOf(sel) < 0) sel = names[0] || '';
  const draw = () => {
    const rows = history.filter(h => h.ex.some(e => e.name === sel)).map(h => ({ h, e: h.ex.find(e => e.name === sel) }));
    const totals = rows.map(r => r.e.sets.reduce((a, s) => a + (parseFloat(r.e.einheit === 'Sek' ? s.r : s.r) || 0), 0));
    const max = Math.max(1, ...totals);
    let b = `<label class="field"><span>Übung</span><select id="histSel">${names.map(n => `<option ${n === sel ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>`;
    if (!rows.length) b += '<div class="empty">Noch kein Training mit dieser Übung gespeichert.</div>';
    else {
      b += `<div class="muted small">Summe pro Training, letzte ${Math.min(16, rows.length)}</div><div class="bars">` +
        totals.slice(-16).map(t => `<i style="height:${Math.round(t / max * 100)}%" title="${t}"></i>`).join('') + '</div>';
      b += rows.slice().reverse().map(r => `<div class="li"><div class="t"><b>${datum(r.h.date)}</b> <span class="muted small">${esc(r.h.dayName)}</span><br>
        <span class="num">${r.e.sets.map(s => `${s.w ? esc(s.w) + ' kg × ' : ''}${esc(s.r || '?')} ${esc(r.e.einheit)}`).join(' · ')}</span></div></div>`).join('');
    }
    b += `<p class="muted small">${history.length} Trainings gespeichert.</p>`;
    $('#sheetBody').innerHTML = b;
    $('#histSel').addEventListener('change', ev => { sel = ev.target.value; LS.set('histEx', sel); draw(); });

  openSheet('Verlauf', ''); draw();
}

      res.push({ r, score, hat: haupt.filter(id => hatZutat(id, set)), fehlt: haupt.filter(id => !hatZutat(id, set)), haupt });
    });
    sortiere(res, (a, b) => b.score - a.score);
    kopf = teile.length ? `${res.length} Treffer für „${esc(rf.q.trim())}“` : `Alle ${res.length} Rezepte`;
  } else {
    if (!zutaten.length) { box.innerHTML = `<div class="empty">Wähl oben aus, was du zuhause hast. Dann suche ich passende Gerichte aus ${recs.length} Rezepten.</div>`; return; }
    recs.forEach(r => {
      if (!filterOk(r)) return;
      const haupt = rezeptZutaten(r).filter(id => !istBasis(id));
      const hat = haupt.filter(id => hatZutat(id, set));
      if (!hat.length) return;
      res.push({ r, hat, fehlt: haupt.filter(id => !hatZutat(id, set)), haupt });
    });
    sortiere(res, (a, b) => a.fehlt.length - b.fehlt.length || b.hat.length - a.hat.length);
    const perfekt = res.filter(x => !x.fehlt.length).length;
    kopf = `${res.length} Gerichte mit deinen Zutaten${perfekt ? ` · ${perfekt} ohne Einkauf` : ''}`;
  }
  let h = `<div class="lab" style="margin:18px 0 10px">${kopf}</div>`;
  if (!res.length) h += rf.mode === 'suche'
    ? '<div class="empty">Nichts gefunden. Versuch ein anderes Wort oder lockere die Filter.</div>'
    : '<div class="empty">Kein Rezept nutzt diese Zutaten. Nimm eine weitere Zutat dazu oder lockere die Filter.</div>';
  h += res.slice(0, recLimit).map(x => recipeCard(x)).join('');
  if (res.length > recLimit) h += `<button class="btn wide" id="recMore">Mehr anzeigen</button>`;
  box.innerHTML = h;
}
function sterne(r) { return r.rt ? `<span>★ ${n1(r.rt)}${r.rc ? ` (${r.rc})` : ''}</span>` : ''; }
function recipeCard(x) {
  const r = x.r; const qn = { fooby: 'fooby', migusto: 'migusto', bettybossi: 'Betty Bossi' }[r.q] || r.q;
  const namen = ids => ids.map(zutName);

  const tag = suche && !zutaten.length ? '' : (x.fehlt.length ? `<span class="tag">${x.fehlt.length} fehlt</span>` : '<span class="tag good">Alles da</span>');
  return `<div class="card rcard">
    ${r.img ? `<img class="hero" loading="lazy" referrerpolicy="no-referrer" src="${esc(r.img)}" alt="${esc(r.n)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'hero none',textContent:'Kein Bild'}))">` : '<div class="hero none">Kein Bild</div>'}
    <div class="body"><div class="spread" style="align-items:flex-start"><h3>${esc(r.n)}</h3>${tag}</div>
      <div class="kv muted">${sterne(r)}<span>${esc(qn)}</span><span>${r.t ? r.t + ' Min' : 'Zeit ' + KA}</span><span>${r.kc ? n0(r.kc) + ' kcal' : 'kcal ' + KA}</span><span>${r.pr ? n0(r.pr) + ' g Protein' : 'Protein ' + KA}</span></div>
      <div class="lines">${suche && !zutaten.length

           ${x.fehlt.length ? `<div class="miss"><b>Fehlt:</b> ${esc(namen(x.fehlt.slice(0, 6)).join(', '))}${x.fehlt.length > 6 ? ' und ' + (x.fehlt.length - 6) + ' mehr' : ''}</div>` : ''}`}

let sf = LS.get('snack', { laden: 'migros', gut: true, cat: '', sort: 'protein', fav: false, q: '' });

let snackLimit = 50;

function proteinPerKcal(p) { return (p.pr != null && p.k) ? p.pr / p.k * 100 : null; }
function isGood(p) {
  if (p.cat === 'nuesse') return false;
  if (p.k == null) return false;
  if (p.cat === 'fruechte' && p.k <= 100) return true;
  if (p.z == null) return false;
  const ppk = proteinPerKcal(p);
  return p.z <= 5 && ((ppk != null && ppk >= 5) || p.k <= 100);
}
function priceOf(p) { return p.a != null ? p.a : p.p; }
function proteinPerChf(p) { const pr = priceOf(p); return (p.pr != null && p.g && pr) ? p.pr * p.g / 100 / pr : null; }

function renderSnacks() {

    <details class="how"><summary>Was heisst gut?</summary><p class="small">Höchstens 5 g Zucker pro 100 g, und dazu mindestens 5 g Protein pro 100 kcal oder höchstens 100 kcal pro 100 g. Früchte bis 100 kcal zählen immer. Nüsse nie, die magst du nicht. Fehlen Nährwerte, gilt der Snack nicht als gut.</p></details></div>`;
  h += '<div class="chips"><button class="chip" data-cat="" aria-pressed="' + (!sf.cat) + '">Alle</button>' +
    Object.keys(KATS).map(k => `<button class="chip" data-cat="${k}" aria-pressed="${sf.cat === k}">${esc(KATS[k])}</button>`).join('') + '</div>';
  const qq = normTerm(sf.q || '');

  items.sort((a, b) => { const x = key(a), y = key(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return asc ? x - y : y - x; });

function snackCard(p) {

/* ======================================================= Barcode Scanner
   Daten: Open Food Facts (frei, ODbL). Yuka hat keine öffentliche Schnittstelle und verbietet automatisches Abfragen.
   Hersteller und Mutterkonzern: Wikidata. Für Firmenethik gibt es keine freie, verlässliche Quelle, darum nur Fakten und Links. */
const ZXING_URL = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
const OFF_FELDER = 'code,product_name,product_name_de,brands,brand_owner,quantity,image_front_small_url,nutriscore_grade,nova_group,ecoscore_grade,additives_tags,nutriments,labels_tags';
const scan = { stream: null, reader: null, timer: 0, aktiv: false, ansicht: null };
function ladeSkript(url) {
  return new Promise((ok, nein) => {
    if (window.ZXing) { ok(); return; }
    const sc = document.createElement('script'); sc.src = url; sc.async = true;
    sc.onload = () => ok(); sc.onerror = () => nein(new Error('Skript nicht geladen'));
    document.head.appendChild(sc);
  });
}
function scanStopp() {
  scan.aktiv = false; clearTimeout(scan.timer);
  try { if (scan.reader) scan.reader.reset(); } catch (e) {}
  scan.reader = null;
  try { if (scan.stream) scan.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  scan.stream = null;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') scanStopp(); });
function scanVerlauf() { return LS.get('scans', []); }
function renderScan() {
  /* Läuft die Kamera schon auf dieser Seite, nicht neu aufbauen (sonst flackert sie) */

  $('#main').innerHTML = `<div class="scan">

    </div>
    <p id="scanStatus" class="scan-status" role="status">Kamera startet</p>

    const v = c.mainsnak && c.mainsnak.datavalue && c.mainsnak.datavalue.value; if (v && v.id && ids.indexOf(v.id) < 0 && v.id !== passend.id) ids.push(v.id);

async function syncData(manual) {

  try {
    const r = await fetch(url, { headers: { 'Authorization': 'Bearer ' + s.token, 'Accept': 'application/vnd.github.raw+json', 'X-GitHub-Api-Version': '2022-11-28' }, cache: 'no-store' });

    return { ok: true, msg: 'Geladen. Stand ' + datumZeit(d.stand) + (neuer ? '' : ', war schon aktuell') + '.' };
  } catch (e) {
    return { ok: false, msg: 'Laden fehlgeschlagen: ' + e.message };
  }
}

function exportData() {
  const out = { app: 'FitApp', v: 1, exportiert: new Date().toISOString(), daten: {} };
  LS.keys().forEach(k => { if (k !== 'fit.sync') { try { out.daten[k] = localStorage.getItem(k); } catch (e) {} } });
  const name = 'fitapp_sicherung_' + new Date().toISOString().slice(0, 10) + '.json';
  if (NATIVE && typeof NATIVE.saveFile === 'function') {
    let wo = '';
    try { wo = NATIVE.saveFile(name, JSON.stringify(out, null, 1)); } catch (e) {}
    toast(wo ? 'Gespeichert: ' + wo : 'Speichern fehlgeschlagen');
    return;
  }
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Sicherung heruntergeladen');
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || d.app !== 'FitApp' || typeof d.daten !== 'object') throw new Error('keine FitApp Sicherung');
    let n = 0;
    Object.entries(d.daten).forEach(([k, v]) => { if (k.indexOf('fit.') === 0 && typeof v === 'string') { try { localStorage.setItem(k, v); n++; } catch (er) {} } });
    plan = loadPlan(); sessions = LS.get('sess', {}); history = LS.get('history', []); curDay = todayDayId();
    zutaten = ladeZutaten(); nogo = LS.get('nogo', NOGO_DEFAULT); favs = LS.get('fav', {}); listen = LS.get('listen', { coop: [], migros: [] });
    sf = LS.get('snack', sf); rf = LS.get('rfilter', rf);
    toast(n + ' Einträge importiert'); closeSheet();
  } catch (er) { toast('Import fehlgeschlagen: ' + er.message); }
});

/* ======================================================= Start */
async function start() {
  try {
    const raw = $('#appdata').textContent.trim();
    if (raw && raw !== 'null' && raw.indexOf('__FITAPP') < 0) { DATA = JSON.parse(raw); EMBEDDED = true; }
  } catch (e) { DATA = null; }
  if (!DATA) DATA = await IDB.get('data');
  setTab(tab);
  Timer.render();
  streakMeldung();
  const s = LS.get('sync', null);
  const last = LS.get('syncAt', 0);
  if (s && s.token && navigator.onLine && (!DATA || Date.now() - last > 3 * 3600 * 1000)) {
    const r = await syncData(false);
    if (!r.ok && !DATA) toast(r.msg);
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    try {
      /* Neue Version sofort holen: sw.js nie aus dem Cache, und nach einem Wechsel einmal neu laden (nicht mitten im Training) */
      const hatteSW = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
      let neu = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (hatteSW && !neu && !hasActiveSession()) { neu = true; location.reload(); } });
    } catch (e) {}
  }
}
start();
</script>
